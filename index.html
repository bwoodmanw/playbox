/* ============================================================
   SOUND LIBRARY
   Everything is synthesised with the Web Audio API, so the whole
   library costs zero bytes of download.
   ============================================================ */
var actx = null;
function audio(){
  if(!actx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    try{ actx = new AC(); }catch(e){ return null; }
  }
  if(actx.state === 'suspended'){ try{ actx.resume(); }catch(e){} }
  return actx;
}

var SOUNDS = [
  /* instruments - pitched, so they get the note pads */
  { id:'bell',    name:'Bells',   emoji:'🔔', cat:'inst', type:'sine',     decay:1.10, gain:.28 },
  { id:'toy',     name:'Toy',     emoji:'🎹', cat:'inst', type:'triangle', decay:0.50, gain:.30 },
  { id:'robot',   name:'Robot',   emoji:'🤖', cat:'inst', type:'square',   decay:0.30, gain:.16 },
  { id:'marimba', name:'Marimba', emoji:'🎋', cat:'inst', type:'sine',     decay:0.34, gain:.34 },
  { id:'flute',   name:'Flute',   emoji:'🦋', cat:'inst', type:'sine',     decay:0.80, gain:.22, soft:true },
  { id:'bass',    name:'Bass',    emoji:'🎸', cat:'inst', type:'triangle', decay:0.45, gain:.34, octave:-2 },
  { id:'organ',   name:'Organ',   emoji:'🎪', cat:'inst', type:'sawtooth', decay:0.60, gain:.14 },
  { id:'box',     name:'Music box',emoji:'✨',      cat:'inst', type:'sine',     decay:1.60, gain:.20, octave:1 },
  /* drums */
  { id:'kick',    name:'Kick',    emoji:'🥁', cat:'drum', drum:'kick' },
  { id:'snare',   name:'Snare',   emoji:'🥁', cat:'drum', drum:'snare' },
  { id:'hat',     name:'Hat',     emoji:'🔛', cat:'drum', drum:'hat' },
  { id:'tom',     name:'Tom',     emoji:'🪩', cat:'drum', drum:'tom' },
  { id:'clap',    name:'Clap',    emoji:'👏', cat:'drum', drum:'clap' },
  { id:'cowbell', name:'Cowbell', emoji:'🐄', cat:'drum', drum:'cowbell' },
  /* fun sounds */
  { id:'boing',   name:'Boing',   emoji:'🪃', cat:'fx', fx:'boing' },
  { id:'zap',     name:'Zap',     emoji:'⚡',       cat:'fx', fx:'zap' },
  { id:'pop',     name:'Pop',     emoji:'🫐', cat:'fx', fx:'pop' },
  { id:'whoosh',  name:'Whoosh',  emoji:'💨', cat:'fx', fx:'whoosh' },
  { id:'laser',   name:'Laser',   emoji:'🛸', cat:'fx', fx:'laser' },
  { id:'magic',   name:'Magic',   emoji:'🧚', cat:'fx', fx:'magic' },
  { id:'siren',   name:'Siren',   emoji:'🚨', cat:'fx', fx:'siren' },
  { id:'drip',    name:'Drip',    emoji:'💧', cat:'fx', fx:'drip' }
];
function sound(id){
  for(var i = 0; i < SOUNDS.length; i++) if(SOUNDS[i].id === id) return SOUNDS[i];
  return SOUNDS[0];
}

/* Pentatonic: any combination sounds pleasant, so a child mashing
   pads never produces a wrong note. */
var NOTES = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
var PAD_COLORS = ['#ff4d8d','#f7941e','#ffd11a','#22b573','#1e9fe0','#6b3fd6','#b06bff','#ff7ab6'];

function noiseSrc(a, dur){
  var len = Math.max(1, Math.floor(a.sampleRate * dur));
  var buf = a.createBuffer(1, len, a.sampleRate);
  var ch = buf.getChannelData(0);
  for(var i = 0; i < len; i++) ch[i] = (Math.random()*2 - 1) * (1 - i/len);
  var src = a.createBufferSource(); src.buffer = buf;
  return src;
}

function play(id, freq, when){
  var a = audio();
  if(!a) return;
  var t = when || a.currentTime;
  var s = sound(id);
  if(s.drum) return playDrum(a, s.drum, t);
  if(s.fx)   return playFx(a, s.fx, t);

  var f = (freq || NOTES[0]) * Math.pow(2, s.octave || 0);
  var osc = a.createOscillator(), g = a.createGain();
  osc.type = s.type; osc.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(s.gain, t + (s.soft ? 0.09 : 0.012));
  g.gain.exponentialRampToValueAtTime(0.0001, t + s.decay);
  osc.connect(g); g.connect(a.destination);
  osc.start(t); osc.stop(t + s.decay + 0.05);

  /* a quiet octave above gives marimba and music box their ring */
  if(s.id === 'marimba' || s.id === 'box'){
    var o2 = a.createOscillator(), g2 = a.createGain();
    o2.type = 'sine'; o2.frequency.setValueAtTime(f*2, t);
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(s.gain*0.35, t + 0.01);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + s.decay*0.6);
    o2.connect(g2); g2.connect(a.destination);
    o2.start(t); o2.stop(t + s.decay);
  }
}

function playDrum(a, kind, t){
  if(kind === 'kick' || kind === 'tom'){
    var hi = kind === 'kick' ? 150 : 220, lo = kind === 'kick' ? 45 : 90;
    var o = a.createOscillator(), g = a.createGain();
    o.frequency.setValueAtTime(hi, t);
    o.frequency.exponentialRampToValueAtTime(lo, t + 0.16);
    g.gain.setValueAtTime(0.6, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.26);
    return;
  }
  if(kind === 'hat'){
    var n = noiseSrc(a, 0.06), hp = a.createBiquadFilter(), g2 = a.createGain();
    hp.type='highpass'; hp.frequency.value = 7000; g2.gain.value = 0.2;
    n.connect(hp); hp.connect(g2); g2.connect(a.destination); n.start(t);
    return;
  }
  if(kind === 'snare'){
    var n2 = noiseSrc(a, 0.16), hp2 = a.createBiquadFilter(), g3 = a.createGain();
    hp2.type='highpass'; hp2.frequency.value = 1400; g3.gain.value = 0.26;
    n2.connect(hp2); hp2.connect(g3); g3.connect(a.destination); n2.start(t);
    var o2 = a.createOscillator(), g4 = a.createGain();
    o2.type='triangle'; o2.frequency.setValueAtTime(190, t);
    g4.gain.setValueAtTime(0.22, t); g4.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o2.connect(g4); g4.connect(a.destination); o2.start(t); o2.stop(t + 0.14);
    return;
  }
  if(kind === 'clap'){
    [0, 0.018, 0.036].forEach(function(d){
      var n3 = noiseSrc(a, 0.07), bp = a.createBiquadFilter(), g5 = a.createGain();
      bp.type='bandpass'; bp.frequency.value = 1600; g5.gain.value = 0.17;
      n3.connect(bp); bp.connect(g5); g5.connect(a.destination); n3.start(t + d);
    });
    return;
  }
  /* cowbell */
  [540, 800].forEach(function(fq){
    var o3 = a.createOscillator(), g6 = a.createGain();
    o3.type='square'; o3.frequency.setValueAtTime(fq, t);
    g6.gain.setValueAtTime(0.09, t); g6.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    o3.connect(g6); g6.connect(a.destination); o3.start(t); o3.stop(t + 0.3);
  });
}

function playFx(a, kind, t){
  var o, g, n, f;
  switch(kind){
    case 'boing':
      o = a.createOscillator(); g = a.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(560, t);
      o.frequency.exponentialRampToValueAtTime(300, t + 0.07);
      o.frequency.exponentialRampToValueAtTime(230, t + 0.15);
      o.frequency.exponentialRampToValueAtTime(160, t + 0.23);
      o.frequency.exponentialRampToValueAtTime(120, t + 0.34);
      g.gain.setValueAtTime(0.3, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.42); break;

    case 'zap':
      o = a.createOscillator(); g = a.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(1400, t);
      o.frequency.exponentialRampToValueAtTime(90, t + 0.18);
      g.gain.setValueAtTime(0.24, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.22); break;

    case 'pop':
      o = a.createOscillator(); g = a.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(320, t);
      o.frequency.exponentialRampToValueAtTime(920, t + 0.055);
      g.gain.setValueAtTime(0.34, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.1); break;

    case 'whoosh':
      n = noiseSrc(a, 0.5); f = a.createBiquadFilter(); g = a.createGain();
      f.type = 'bandpass'; f.Q.value = 1.4;
      f.frequency.setValueAtTime(300, t);
      f.frequency.exponentialRampToValueAtTime(3600, t + 0.28);
      f.frequency.exponentialRampToValueAtTime(400, t + 0.5);
      g.gain.value = 0.3;
      n.connect(f); f.connect(g); g.connect(a.destination); n.start(t); break;

    case 'laser':
      o = a.createOscillator(); g = a.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(1800, t);
      o.frequency.exponentialRampToValueAtTime(180, t + 0.26);
      g.gain.setValueAtTime(0.14, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.3); break;

    case 'magic':
      [0,0.06,0.12,0.18,0.24].forEach(function(d, i){
        var oo = a.createOscillator(), gg = a.createGain();
        oo.type = 'sine'; oo.frequency.setValueAtTime(700 + i*260, t + d);
        gg.gain.setValueAtTime(0.0001, t + d);
        gg.gain.exponentialRampToValueAtTime(0.18, t + d + 0.01);
        gg.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.22);
        oo.connect(gg); gg.connect(a.destination);
        oo.start(t + d); oo.stop(t + d + 0.24);
      }); break;

    case 'siren':
      o = a.createOscillator(); g = a.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(620, t);
      o.frequency.linearRampToValueAtTime(980, t + 0.25);
      o.frequency.linearRampToValueAtTime(620, t + 0.5);
      o.frequency.linearRampToValueAtTime(980, t + 0.75);
      g.gain.setValueAtTime(0.16, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.92); break;

    default: /* drip */
      o = a.createOscillator(); g = a.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(900, t);
      o.frequency.exponentialRampToValueAtTime(2400, t + 0.07);
      g.gain.setValueAtTime(0.22, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.14);
  }
}

function buildMusicControls(){
  var ctl = $('mctl');

    b.addEventListener('click', fn);
    ctl.appendChild(b);
    return b;
  }
  mk('go', seqOn ? '⏸ Stop' : '▶ Play', function(){
    if(seqOn) stopSequencer(); else startSequencer();
    buildMusicControls();
  }, 'Play or stop');
  mk('', '🐢', function(){ setBpm(bpm - 12); }, 'Slower');
  mk('', '🐇', function(){ setBpm(bpm + 12); }, 'Faster');
  var lbl = document.createElement('span');
  lbl.id = 'tempoLbl'; lbl.style.fontWeight = '800'; lbl.style.opacity = '.85';

  mk('', '🎵 Songs', openSongs, 'Songs');
  mk('warn', '🗑️', function(){
    grid = blankGrid(); store.set('grid', grid); buildSeq(); toast('Song cleared');

function openSongs(){
  var saved = store.get('songs', {});

  Object.keys(PRESETS).forEach(function(n){

  });

  var names = Object.keys(saved);
  if(names.length === 0) html += '<span style="grid-column:1/-1;color:#5b5175;font-weight:600">Nothing saved yet</span>';
  names.forEach(function(n){ html += '<button data-mine="' + n + '"><span class="pe">⭐</span>' + n + '</button>'; });
  html += '</div><div class="sheetrow"><button id="songSave">💾 Save mine</button><button id="songNo">Close</button></div>';
  showModal(html);

  function loadSong(song){
    seqRows = song.rows.slice();
    grid = song.g.map(function(r){ return r.slice(); });
    bpm = song.bpm;
    store.set('seqRows', seqRows); store.set('grid', grid); store.set('bpm', bpm);
    buildSeq(); buildMusicControls(); closeModal(); toast('Loaded!');
  }
  var ps = $('sheet').querySelectorAll('[data-preset]');
  for(var i = 0; i < ps.length; i++){
    (function(b){ b.addEventListener('click', function(){ loadSong(PRESETS[b.getAttribute('data-preset')]); }); })(ps[i]);
  }
  var ms = $('sheet').querySelectorAll('[data-mine]');
  for(var j = 0; j < ms.length; j++){
    (function(b){ b.addEventListener('click', function(){ loadSong(saved[b.getAttribute('data-mine')]); }); })(ms[j]);
  }

    var existing = Object.keys(saved);
    if(existing.length >= 6){ toast('That is 6 songs already'); return; }
    var name = 'Song ' + (existing.length + 1);
    saved[name] = { rows: seqRows.slice(), g: grid.map(function(r){ return r.slice(); }), bpm: bpm };
    if(store.set('songs', saved)){ closeModal(); toast('Saved as ' + name); }
    else toast('No room to save');
  };
  $('songNo').onclick = closeModal;
}

function startSequencer(){
  if(!audio()){ toast('Sound is not available'); return; }
  seqOn = true; seqStep = 0;
  var interval = (60/bpm) * 1000 / 4;
  seqTimer = setInterval(function(){
    var cells = document.querySelectorAll('#seq .cell');
    for(var i = 0; i < cells.length; i++) cells[i].classList.remove('play');
    for(var ri = 0; ri < seqRows.length; ri++){
      var cell = document.querySelector('#seq .cell[data-r="' + ri + '"][data-s="' + seqStep + '"]');
      if(cell) cell.classList.add('play');
      if(grid[ri][seqStep]) play(seqRows[ri], NOTES[2 + (ri % 4)]);
    }
    seqStep = (seqStep + 1) % STEPS;
  }, interval);
}

function stopSequencer(){
  seqOn = false;
  clearInterval(seqTimer); seqTimer = null;
  var cells = document.querySelectorAll('#seq .cell');
  for(var i = 0; i < cells.length; i++) cells[i].classList.remove('play');
}

var MAX_SAVES = 48;

function thumbData(canvas, maxW){
  var scale = Math.min(1, (maxW || 640) / canvas.width);
  var out = document.createElement('canvas');
  out.width = Math.max(1, Math.round(canvas.width * scale));
  out.height = Math.max(1, Math.round(canvas.height * scale));
  var g = out.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0,0,out.width,out.height);
  g.drawImage(canvas, 0, 0, out.width, out.height);
  try{ return out.toDataURL('image/jpeg', 0.78); }catch(e){ return null; }
}

function commitSave(item){
  var items = store.get('gallery', []);
  items.unshift(item);
  while(items.length > MAX_SAVES) items.pop();
  var ok = store.set('gallery', items);
  while(!ok && items.length > 1){ items.pop(); ok = store.set('gallery', items); }
  if(ok) toast('Saved to My Stuff!');
  else toast('Storage is full - delete something in My Stuff');
}

function saveToGallery(canvas, kind){
  var data = thumbData(canvas, 640);
  if(!data){ toast('Could not save this one'); return; }
  commitSave({ id: Date.now(), kind: kind, data: data });
}

function saveAnimation(){
  captureFrame();
  if(S.frames.length < 2){ toast('Add another frame first!'); return; }
  var frames = [];
  for(var i = 0; i < S.frames.length; i++){
    var d = thumbData(flatten($('animBg'), S.frames[i]), 320);
    if(!d){ toast('Could not save this one'); return; }
    frames.push(d);
  }
  var durs = S.frames.map(function(f){ return frameDur(f); });
  commitSave({ id: Date.now(), kind: 'anim', data: frames[0], frames: frames,
               fps: S.fps, durs: durs });
}

function whenMade(ts){
  var diff = Date.now() - ts;
  var day = 86400000;
  if(diff < day) return 'Today';
  if(diff < day*2) return 'Yesterday';
  if(diff < day*7) return Math.floor(diff/day) + ' days ago';
  var d = new Date(ts);
  return d.getDate() + '/' + (d.getMonth()+1);
}

    bar.appendChild(b);
  });

  var sep = document.createElement('div'); sep.className = 'sep'; bar.appendChild(sep);
  var slbl = document.createElement('span');
  slbl.className = 'lbl'; slbl.textContent = 'Order';
  bar.appendChild(slbl);

  [['new','\u2B07 Newest'],['old','\u2B06 Oldest'],['kind','\uD83D\uDCC1 By type']].forEach(function(o){
    var b = document.createElement('button');
    b.className = 'chip' + (S.galSort === o[0] ? ' sel' : '');
    b.textContent = o[1];
    b.addEventListener('click', function(){ S.galSort = o[0]; buildGallery(); });
    bar.appendChild(b);
  });

  var sep2 = document.createElement('div'); sep2.className = 'sep'; bar.appendChild(sep2);
  var pick = document.createElement('button');
  pick.className = 'chip' + (S.selMode ? ' sel' : '');
  pick.innerHTML = S.selMode ? '\u2716 Cancel' : '\u2611 Select';
  pick.addEventListener('click', function(){
    S.selMode = !S.selMode;
    if(!S.selMode) S.selIds = [];
    buildGallery();
  });
  bar.appendChild(pick);
}

function buildSelBar(){
  var bar = $('selBar');
  bar.classList.toggle('on', S.selMode);
  if(!S.selMode) return;
  bar.innerHTML = '';
  var count = document.createElement('span');
  count.id = 'selCount';
  count.textContent = S.selIds.length + ' chosen';
  bar.appendChild(count);

  function mk(cls, txt, fn){
    var b = document.createElement('button');
    b.className = 'act ' + cls; b.innerHTML = txt;
    b.disabled = S.selIds.length === 0 && cls !== '';
    b.addEventListener('click', fn);
    bar.appendChild(b);
  }
  mk('', '\u2611 All', function(){
    S.selIds = visibleItems().map(function(x){ return x.id; });
    buildGallery();
  });
  mk('', '\u2610 None', function(){ S.selIds = []; buildGallery(); });
  mk('go', '\uD83D\uDCE4 Share', function(){ shareSelected(); });
  mk('warn', '\uD83D\uDDD1\uFE0F Delete', function(){
    if(S.selIds.length === 0) return;
    grownUpGate('Delete ' + S.selIds.length + ' item' + (S.selIds.length === 1 ? '' : 's') + '?', function(){
      var keep = store.get('gallery', []).filter(function(x){ return S.selIds.indexOf(x.id) === -1; });
      store.set('gallery', keep);
      var n = S.selIds.length;
      S.selIds = []; S.selMode = false;
      buildGallery(); toast('Deleted ' + n);
    });
  });
}

function visibleItems(){
  var all = store.get('gallery', []);
  var items = all.filter(function(x){ return S.galFilter === 'all' || x.kind === S.galFilter; });
  if(S.galSort === 'old') items = items.slice().sort(function(a,b){ return a.id - b.id; });
  else if(S.galSort === 'kind') items = items.slice().sort(function(a,b){
    if(a.kind === b.kind) return b.id - a.id;
    return a.kind < b.kind ? -1 : 1;
  });
  else items = items.slice().sort(function(a,b){ return b.id - a.id; });
  return items;
}

function dataURLtoFile(dataURL, name){
  var parts = dataURL.split(',');
  var mime = (parts[0].match(/:(.*?);/) || [null,'image/jpeg'])[1];
  var bin = atob(parts[1]);
  var arr = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  try{ return new File([arr], name, { type: mime }); }
  catch(e){ return new Blob([arr], { type: mime }); }
}

/* Web Share where the browser supports it. Amazon's kids browser very likely
   does not, so the fallback shows the pictures full size with instructions
   rather than silently failing. */
function shareSelected(){
  if(S.selIds.length === 0) return;
  var all = store.get('gallery', []);
  var chosen = all.filter(function(x){ return S.selIds.indexOf(x.id) !== -1; });
  var files = [];
  try{
    chosen.forEach(function(it, i){
      files.push(dataURLtoFile(it.data, 'playbox-' + (i+1) + '.jpg'));
    });
  }catch(e){ files = []; }

  if(files.length && navigator.share && navigator.canShare && navigator.canShare({ files: files })){
    navigator.share({ files: files, title: 'Playbox' })
      .then(function(){ toast('Shared'); })
      .catch(function(){ /* user dismissed - say nothing */ });
    return;
  }
  var html = '<h2>Save or share</h2><p>This browser cannot hand pictures to other apps. ' +
             'Press and hold a picture to save it, then share it from your photos.</p>';
  chosen.forEach(function(it){
    html += '<img src="' + it.data + '" style="width:100%;border-radius:14px;margin-bottom:10px" alt="">';
  });
  html += '<div class="sheetrow"><button class="go" id="shNo">Close</button></div>';
  showModal(html);
  $('shNo').onclick = closeModal;
}

/* Reopen a saved painting or sticker scene in Paint to keep working on it. */
function continueInPaint(it){
  go('paint');
  setTimeout(function(){
    var img = new Image();
    img.onload = function(){
      pushUndo();
      clearBoard();
      var z = cssSize(DC);
      var sc = Math.min(z.w / img.width, z.h / img.height) * 0.92;  /* breathing room */
      var w = img.width * sc, h = img.height * sc;
      DX.drawImage(img, (z.w - w)/2, (z.h - h)/2, w, h);
      toast('Carry on where you left off');
    };
    img.onerror = function(){ toast('Could not open that one'); };
    img.src = it.data;
  }, 160);
}

function buildGallery(){
  var all = store.get('gallery', []);
  buildGalleryBar(all);
  buildSelBar();

  var items = visibleItems();
  var g = $('ggrid');
  g.innerHTML = '';

  if(all.length === 0){
    g.innerHTML = '<div class="empty" style="grid-column:1/-1">Nothing saved yet.<br>' +
                  'Make something in Paint, Animate or Stickers, then tap Save.</div>';
    g.appendChild(galleryFooter(all, items));   /* Restore must be reachable when empty */
    return;
  }
  if(items.length === 0){
    g.innerHTML = '<div class="empty" style="grid-column:1/-1">No ' +
                  (GAL_KINDS.filter(function(k){ return k.id===S.galFilter; })[0]||{}).name +
                  ' yet.<br>Tap Everything to see the rest.</div>';
    g.appendChild(galleryFooter(all, items));
    return;
  }

  items.forEach(function(it){
    var d = document.createElement('div');
    d.className = 'gitem' + (S.selIds.indexOf(it.id) !== -1 ? ' picked' : '');
    var img = document.createElement('img');
    img.src = it.data; img.alt = GAL_LABEL[it.kind] || 'Picture';
    d.appendChild(img);
    var tag = document.createElement('div');
    tag.className = 'tag'; tag.textContent = GAL_LABEL[it.kind] || 'Picture';
    d.appendChild(tag);
    var when = document.createElement('div');
    when.className = 'when'; when.textContent = whenMade(it.id);
    d.appendChild(when);

    if(S.selMode){
      var tick = document.createElement('div');
      tick.className = 'tick'; tick.textContent = '\u2714';
      d.appendChild(tick);
      d.addEventListener('click', function(){
        var i = S.selIds.indexOf(it.id);
        if(i === -1) S.selIds.push(it.id); else S.selIds.splice(i, 1);
        buildGallery();
      });
      g.appendChild(d);
      return;                       /* no per-item buttons while choosing */
    }

    var row = document.createElement('div');
    row.className = 'grow';

    var view = document.createElement('button');
    view.textContent = it.kind === 'anim' ? '\u25B6 Play' : '\uD83D\uDD0D Big';
    view.addEventListener('click', function(){
      if(it.kind === 'anim') playSavedAnim(it); else viewBig(it);
    });
    row.appendChild(view);

    var edit = document.createElement('button');
    edit.textContent = '\u270F\uFE0F Edit';
    edit.setAttribute('aria-label', 'Keep working on this');
    edit.addEventListener('click', function(){
      if(it.kind === 'anim') loadAnimIntoEditor(it); else continueInPaint(it);
    });
    row.appendChild(edit);

    var del = document.createElement('button');
    del.className = 'del'; del.textContent = '\uD83D\uDDD1\uFE0F';
    del.setAttribute('aria-label', 'Delete');
    del.addEventListener('click', function(){
      grownUpGate('Delete this?', function(){
        var list = store.get('gallery', []).filter(function(x){ return x.id !== it.id; });
        store.set('gallery', list); buildGallery(); toast('Deleted');
      });
    });
    row.appendChild(del);
    d.appendChild(row);
    g.appendChild(d);
  });

  g.appendChild(galleryFooter(all, items));
}

function galleryFooter(all, items){
  var foot = document.createElement('div');
  foot.style.cssText = 'grid-column:1/-1;text-align:center;padding-top:10px';

  if(all.length){
    var count = document.createElement('div');
    count.style.cssText = 'color:#5b5175;font-weight:700;font-size:14px;margin-bottom:10px';
    count.textContent = 'Showing ' + items.length + ' of ' + all.length +
                        ' · room for ' + Math.max(0, MAX_SAVES - all.length) + ' more';
    foot.appendChild(count);

    var wb = document.createElement('button');
    wb.className = 'act warn'; wb.style.margin = '0 auto';
    wb.textContent = '🗑️ Delete everything';
    wb.addEventListener('click', function(){
      grownUpGate('Delete everything saved?', function(){
        store.del('gallery'); S.selIds = []; buildGallery(); toast('All cleared');
      });
    });
    foot.appendChild(wb);
  }

  var tools = document.createElement('div');
  tools.style.cssText = 'margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap';
  var bak = document.createElement('button');
  bak.className = 'act'; bak.textContent = '💾 Back up';
  bak.addEventListener('click', exportBackup);
  tools.appendChild(bak);
  var res = document.createElement('button');
  res.className = 'act'; res.textContent = '📂 Restore';
  res.addEventListener('click', function(){ $('bakIn').click(); });
  tools.appendChild(res);
  foot.appendChild(tools);

  var note = document.createElement('div');
  note.id = 'storeNote';
  note.style.cssText = 'color:#5b5175;font-weight:600;font-size:12px;margin-top:10px;line-height:1.5';
  note.textContent = 'Saved in this browser on this tablet only — no account needed.';
  foot.appendChild(note);
  describeStorage();
  return foot;
}

/* Report how much room is left and whether the browser promised to keep it. */
function describeStorage(){
  var el = $('storeNote');
  if(!el) return;
  var base = 'Saved in this browser on this tablet only \u2014 no account needed. ';
  try{
    if(navigator.storage && navigator.storage.estimate){
      navigator.storage.estimate().then(function(est){
        var used = est.usage ? (est.usage/1048576).toFixed(1) : '?';
        var cap  = est.quota ? (est.quota/1048576).toFixed(0) : '?';
        var msg = base + 'Using ' + used + ' MB of about ' + cap + ' MB.';
        if(navigator.storage.persisted){
          navigator.storage.persisted().then(function(p){
            el.textContent = msg + (p ? ' The tablet has been asked to keep it safe.'
                                      : ' Back up now and then, just in case.');
          });
        } else el.textContent = msg;
      });
    }
  }catch(e){}
}

var BACKUP_KEYS = ['gallery','mytraces','songs','grid','seqRows','bpm',
                   'customColors','paintEnv','animEnv','sceneEnv'];

function exportBackup(){
  var data = { playbox: 1, when: Date.now() };
  BACKUP_KEYS.forEach(function(k){ data[k] = store.get(k, null); });
  var json = JSON.stringify(data);
  var name = 'playbox-backup-' + new Date().toISOString().slice(0,10) + '.json';
  try{
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1500);
    toast('Backup saved to your downloads');
  }catch(e){
    showModal('<h2>Backup</h2><p>This browser will not let the page save a file. ' +
      'Open Playbox in the grown-up browser to back up, or keep the pictures by ' +
      'pressing and holding each one.</p>' +
      '<div class="sheetrow"><button class="go" id="bkNo">Close</button></div>');
    $('bkNo').onclick = closeModal;
  }
}

$('bakIn').addEventListener('change', function(){
  var f = this.files && this.files[0];
  this.value = '';
  if(!f) return;
  var r = new FileReader();
  r.onload = function(ev){
    var data;
    try{ data = JSON.parse(ev.target.result); }
    catch(e){ toast('That is not a Playbox backup'); return; }
    if(!data || !data.playbox){ toast('That is not a Playbox backup'); return; }
    grownUpGate('Restore this backup? It replaces what is saved now.', function(){
      var restored = 0;
      BACKUP_KEYS.forEach(function(k){
        if(data[k] !== null && data[k] !== undefined){
          if(store.set(k, data[k])) restored++;
        }
      });
      /* pull the restored settings back into the running app */
      seqRows = store.get('seqRows', seqRows);
      grid = store.get('grid', grid);
      bpm = store.get('bpm', bpm);
      S.customColors = store.get('customColors', []);
      S.paintEnv = store.get('paintEnv', 'none');
      S.animEnv = store.get('animEnv', 'none');
      S.sceneEnv = store.get('sceneEnv', 'none');
      buildColors('paintColors'); buildColors('animColors');
      buildGallery();
      toast('Restored ' + restored + ' things');
    });
  };
  r.onerror = function(){ toast('Could not read that file'); };
  r.readAsText(f);
});

function viewBig(it){
  showModal('<h2>Nice work!</h2><img src="' + it.data + '" style="width:100%;border-radius:14px;margin-bottom:13px" alt="">' +
    '<div class="sheetrow"><button class="go" id="closeBig">Close</button></div>');
  $('closeBig').onclick = closeModal;
}

var savedAnimTimer = null;
function playSavedAnim(it){
  showModal('<h2>Your cartoon</h2><img id="animView" src="' + it.frames[0] +
    '" style="width:100%;border-radius:14px;margin-bottom:13px;background:#fff" alt="">' +
    '<div class="sheetrow"><button class="go" id="closeAnim">Close</button></div>');
  var i = 0, el = $('animView');
  clearTimeout(savedAnimTimer);
  function hold(n){
    return it.durs && typeof it.durs[n] === 'number'
      ? Math.max(30, it.durs[n] * 1000)
      : 1000 / (it.fps || 5);
  }
  function tick(){
    if(!document.body.contains(el)){ savedAnimTimer = null; return; }
    i = (i + 1) % it.frames.length;
    el.src = it.frames[i];
    savedAnimTimer = setTimeout(tick, hold(i));
  }
  savedAnimTimer = setTimeout(tick, hold(0));
  $('closeAnim').onclick = function(){ clearTimeout(savedAnimTimer); savedAnimTimer = null; closeModal(); };
}

/* Load a saved cartoon back into the editor so it can be changed. */
function loadAnimIntoEditor(it){
  closeModal();
  go('anim');
  setTimeout(function(){
    var loaded = 0;
    var newFrames = it.frames.map(function(){ return blankFrame(); });
    it.frames.forEach(function(src, i){
      var im = new Image();
      im.onload = function(){
        var g = newFrames[i].getContext('2d');
        g.setTransform(1,0,0,1,0,0);
        g.fillStyle = '#fff'; g.fillRect(0,0,newFrames[i].width,newFrames[i].height);
        g.drawImage(im, 0, 0, newFrames[i].width, newFrames[i].height);
        loaded++;
        if(loaded === it.frames.length){
          if(it.durs) newFrames.forEach(function(f, k){
            if(typeof it.durs[k] === 'number') f.dur = it.durs[k];
          });
          S.frames = newFrames; S.frameIdx = 0; S.fps = it.fps || 5;
          undoStacks.anim.length = 0; refreshUndoButtons();
          loadFrame(0); buildStrip(); toast('Loaded - keep going!');
        }
      };
      im.onerror = function(){ loaded++; };
      im.src = src;
    });
  }, 140);
}

/* ============================================================
   NAVIGATION / AGE / BOOT
   ============================================================ */
var TITLES = { home:'Playbox', paint:'Paint', anim:'Animate', scene:'Stickers', music:'Music', gallery:'My Stuff' };

function go(name){
  if(S.screen === 'music' && name !== 'music') stopSequencer();
  if(S.screen === 'anim' && name !== 'anim'){ stopPlay(); if(S.frames.length) captureFrame(); }
  var screens = document.querySelectorAll('.screen');
  for(var i = 0; i < screens.length; i++) screens[i].classList.remove('on');
  $(name).classList.add('on');
  S.screen = name;
  $('title').textContent = TITLES[name] || 'Playbox';
  $('backBtn').style.visibility = (name === 'home') ? 'hidden' : 'visible';

  if(name === 'paint') setTimeout(enterPaint, 0);
  if(name === 'anim')  setTimeout(enterAnim, 0);
  if(name === 'scene') buildScene();
  if(name === 'music') buildMusic();
  if(name === 'gallery') buildGallery();
}

$('backBtn').addEventListener('click', function(){ go('home'); });
var cards = document.querySelectorAll('[data-go]');
for(var ci = 0; ci < cards.length; ci++){
  (function(el){
    el.addEventListener('click', function(){
      var dest = el.getAttribute('data-go');
      if(dest === 'trace'){ go('paint'); setTimeout(openTemplates, 180); return; }
      go(dest);
    });
  })(cards[ci]);
}

function applyAge(){
  if(palette().indexOf(S.color) === -1) S.color = palette()[0];
  S.size = 10;
  buildRail('paintRail'); buildRail('animRail');
  buildColors('paintColors'); buildColors('animColors');
  buildSizes('paintSizes'); buildSizes('animSizes');
  buildShapeBar();
  if(S.screen === 'scene') buildScene();
  if(S.screen === 'music') buildMusic();
  if(S.screen === 'anim') buildStrip();
}

$('helpBtn').addEventListener('click', function(){
  showModal('<h2>How to use Playbox</h2>' +
    '<p style="text-align:left;line-height:1.6">' +
    '<b>\uD83C\uDFA8 Paint</b> \u2013 pick a brush on the left, a colour along the bottom.<br>' +
    '<b>\uD83D\uDDBC\uFE0F Trace</b> \u2013 outline pictures to colour in. Also on the ' +
    '<b>Traces</b> button while painting.<br>' +
    '<b>\uD83C\uDF33 Scene</b> \u2013 puts a background behind your art. Swap it any time; ' +
    'your drawing stays put.<br>' +
    '<b>\uD83C\uDFAC Animate</b> \u2013 draw frames and play them as a cartoon. Set how long ' +
    'each one holds.<br>' +
    '<b>\uD83C\uDFB5 Music</b> \u2013 tap pads, or build a beat in the grid.<br>' +
    '<b>\uD83D\uDDC2\uFE0F My Stuff</b> \u2013 everything you saved. Tap <b>Select</b> to ' +
    'tick several at once and delete or share them.' +
    '</p><div class="sheetrow"><button class="go" id="helpDone">Got it</button></div>');
  $('helpDone').onclick = closeModal;
});

$('fsBtn').addEventListener('click', function(){
  var d = document, el = d.documentElement;
  var isFs = d.fullscreenElement || d.webkitFullscreenElement;
  try{
    if(isFs){
      if(d.exitFullscreen) d.exitFullscreen();
      else if(d.webkitExitFullscreen) d.webkitExitFullscreen();
    } else if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else toast('Full screen is not available here');
  }catch(e){ toast('Full screen is not available here'); }
});

/* Silk and mobile Chromium will rubber-band or zoom the page mid-stroke;
   these keep a dragging finger drawing instead of scrolling. */
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){ if(e.touches.length > 1) e.preventDefault(); }, { passive:false });
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ e.preventDefault(); });

var resizeTimer = null;
function onResize(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    if(S.screen === 'paint'){
      fitStack($('paintWrap'), $('paintStack'), $('paintCanvas'), [$('paintOverlay'), $('paintBg')]);
      renderEnv($('paintBg'), S.paintEnv);
    }
    if(S.screen === 'anim'){
      fitStack($('animWrap'), $('animStack'), $('animCanvas'), [$('animOverlay'), $('animOnion'), $('animBg')]);
      renderEnv($('animBg'), S.animEnv);
      loadFrame(S.frameIdx);
    }
    if(S.screen === 'scene') fitSceneBg();
  }, 160);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', function(){ setTimeout(onResize, 300); });

applyAge();
requestPersistence();
go('home');

/* exposed only so the page can be smoke-tested from the console */
window.__playbox = { S:S, SOUNDS:SOUNDS, TEMPLATES:TEMPLATES, TOOLS:TOOLS, SHAPES:SHAPES,
                     PRESETS:PRESETS, TPL_CATS:TPL_CATS, GAL_KINDS:GAL_KINDS, ENVIRONMENTS:ENVIRONMENTS,
                     ENV_CATS:ENV_CATS, renderTemplate:renderTemplate, renderEnv:renderEnv, flatten:flatten,
                     placeImport:placeImport, toOutline:toOutline, openTemplates:openTemplates,
                     openCropper:openCropper, saveMyTrace:saveMyTrace, exportBackup:exportBackup,
                     loadExtraTraces:loadExtraTraces, keyOutWhite:keyOutWhite,
                     getExtra:function(){ return EXTRA; }, go:go };

})();

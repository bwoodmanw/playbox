<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4c2fb8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Playbox - a free drawing, sticker, music and animation playground for kids.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236b3fd6'/%3E%3Ccircle cx='22' cy='24' r='8' fill='%23ff4d8d'/%3E%3Ccircle cx='42' cy='24' r='8' fill='%23ffd11a'/%3E%3Ccircle cx='32' cy='43' r='8' fill='%2322b573'/%3E%3C/svg%3E">
<title>Playbox</title>
<style>
:root{
  --ink:#241a3d;
  --ink-soft:#5b5175;
  --paper:#fffdf7;
  --sky:#eef3ff;
  --line:rgba(36,26,61,.14);
  --shadow:0 6px 0 rgba(36,26,61,.18);
  --shadow-lg:0 10px 30px rgba(36,26,61,.22);
  --grape:#6b3fd6;
  --grape-dark:#4c2fb8;
  --berry:#ff4d8d;
  --sun:#ffb020;
  --leaf:#22b573;
  --tap:60px;
  --rail:80px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;padding:0;height:100%;width:100%;
  overflow:hidden;overscroll-behavior:none;
  background:var(--grape-dark);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--sky)}

#nojs{position:fixed;inset:0;z-index:999;background:#4c2fb8;color:#fff;display:flex;
  align-items:center;justify-content:center;text-align:center;padding:30px;font-size:19px;font-weight:700;line-height:1.5}

/* ---------- top bar ---------- */
#topbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 9px;
  padding-top:calc(7px + env(safe-area-inset-top,0px));
  background:linear-gradient(180deg,var(--grape) 0%,var(--grape-dark) 100%);
  color:#fff;box-shadow:0 3px 12px rgba(36,26,61,.35);z-index:20}
.tbtn{min-width:var(--tap);height:var(--tap);padding:0 14px;border-radius:17px;
  background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;
  gap:7px;font-weight:800;font-size:16px;line-height:1;white-space:nowrap}
.tbtn:active{transform:scale(.94);background:rgba(255,255,255,.32)}
.tbtn.icon{padding:0;font-size:24px}
#title{flex:1;font-size:21px;font-weight:900;padding-left:4px;
  text-shadow:0 2px 0 rgba(0,0,0,.18);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#agePill{background:#fff;color:var(--grape-dark);border-radius:11px;padding:4px 9px;font-size:14px;font-weight:900}

/* ---------- screens ---------- */
#stage{flex:1 1 auto;position:relative;min-height:0}
.screen{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.screen.on{display:flex}

/* ---------- home ---------- */
#home{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;
  background:
    radial-gradient(circle at 12% 18%, #ffe6f0 0 22%, transparent 23%),
    radial-gradient(circle at 88% 12%, #e2f6ff 0 18%, transparent 19%),
    radial-gradient(circle at 78% 88%, #e8ffe9 0 20%, transparent 21%),
    var(--sky);display:none}
#home.on{display:block}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;max-width:940px;margin:0 auto}
.card{border-radius:24px;padding:20px 16px;color:#fff;text-align:center;box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:140px;width:100%}
.card:active{transform:translateY(3px) scale(.98)}
.card .emo{font-size:50px;line-height:1}
.card .nm{font-size:22px;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.card .sub{font-size:13px;font-weight:600;opacity:.92}
.c1{background:linear-gradient(150deg,#ff7ab6,#ff4d8d)}
.c2{background:linear-gradient(150deg,#63d0ff,#1e9fe0)}
.c3{background:linear-gradient(150deg,#7be0a8,#22b573)}
.c4{background:linear-gradient(150deg,#ffd166,#f7941e)}
.c5{background:linear-gradient(150deg,#b06bff,#6b3fd6)}
.c6{background:linear-gradient(150deg,#4ecdc4,#118ab2)}
.homehead{text-align:center;margin:4px 0 16px}
.homehead h1{margin:0;font-size:38px;font-weight:900;color:var(--grape-dark);letter-spacing:-.5px}
.homehead p{margin:5px 0 0;color:var(--ink-soft);font-weight:600;font-size:15px}

/* ---------- work area ---------- */
.work{flex:1 1 auto;display:flex;min-height:0}
.rail{flex:0 0 var(--rail);background:#fff;border-right:2px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 5px;
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.tool{width:64px;height:60px;flex:0 0 auto;border-radius:18px;background:var(--sky);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:3px solid transparent}
.tool .ti{font-size:24px;line-height:1}
.tool .tl{font-size:9px;font-weight:800;color:var(--ink-soft)}
.tool.sel{background:#ffe9f2;border-color:var(--berry)}
.tool.sel .tl{color:var(--berry)}
.tool:active{transform:scale(.93)}
.canvaswrap{flex:1 1 auto;position:relative;min-width:0;background:#cfd8ee;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.canvasstack{position:relative;line-height:0;transform-origin:50% 50%;will-change:transform}
canvas.bg{position:absolute;left:0;top:0;z-index:0;background:#fff;pointer-events:none}
canvas.trace{position:absolute;left:0;top:0;z-index:1;background:transparent;pointer-events:none}
canvas.trace.front{z-index:3}
canvas.board{display:block;position:relative;z-index:2;background:transparent;touch-action:none}
canvas.onion{position:absolute;left:0;top:0;z-index:4;background:transparent;pointer-events:none;opacity:.28}
canvas.overlay{position:absolute;left:0;top:0;z-index:5;background:transparent;pointer-events:none}
.canvasstack{box-shadow:0 0 0 2px rgba(36,26,61,.12)}
#sceneBg{position:absolute;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none}
.stk{z-index:1}

/* ---------- trays ---------- */
.tray{flex:0 0 auto;background:#fff;border-top:2px solid var(--line);
  padding:7px 9px;padding-bottom:calc(7px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:9px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.subbar{flex:0 0 auto;background:#f6f4ff;border-top:2px solid var(--line);padding:6px 9px;
  display:flex;align-items:center;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.subbar.hide{display:none}
.swatches{display:flex;gap:7px;flex:1 1 auto;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px}
.sw{width:48px;height:48px;flex:0 0 auto;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw.sel{box-shadow:0 0 0 4px var(--ink);transform:scale(1.08)}
.sw:active{transform:scale(.9)}
.sizes{display:flex;gap:5px;flex:0 0 auto;align-items:center}
.sz{width:48px;height:48px;border-radius:15px;background:var(--sky);display:flex;align-items:center;justify-content:center;border:3px solid transparent}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz.sel{border-color:var(--berry);background:#ffe9f2}
.act{height:52px;min-width:52px;padding:0 13px;border-radius:17px;background:var(--sky);
  display:flex;align-items:center;justify-content:center;gap:5px;font-weight:800;font-size:14px;
  flex:0 0 auto;border:2px solid var(--line)}
.act:active{transform:scale(.94)}
.act.go{background:var(--leaf);color:#fff;border-color:transparent}
.act.warn{background:#ffe1e6;color:#c02a4f;border-color:transparent}
.act.sel{background:var(--berry);color:#fff;border-color:transparent}
.act[disabled]{opacity:.35}
.sep{width:2px;height:40px;background:var(--line);flex:0 0 auto;border-radius:2px}
/* the bar is one scroller of fixed-width groups; nesting a growing scroller
   inside it meant it shrank to fit and never actually scrolled */
.trayscroll{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:9px;
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding:2px 0;
  scrollbar-width:thin}
.trayscroll::-webkit-scrollbar{height:5px}
.trayscroll::-webkit-scrollbar-thumb{background:rgba(36,26,61,.28);border-radius:3px}
.trayscroll > *{flex:0 0 auto}
.trayfixed{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding-left:9px;
  margin-left:2px;border-left:2px solid var(--line)}
.zlbl{font-weight:900;font-size:13px;color:var(--ink-soft);min-width:46px;text-align:center}
/* On a phone the pinned group ate nearly the whole bar, leaving a 62px
   window to scroll 2400px of tools through. Give each its own row instead. */
@media (max-width:560px){
  .tray{flex-wrap:wrap;gap:6px}
  .trayscroll{flex:1 0 100%;order:1}
  .trayfixed{flex:1 0 100%;order:2;border-left:0;border-top:2px solid var(--line);
    padding-left:0;padding-top:7px;margin-left:0;justify-content:space-between}
  .trayfixed .act{flex:1 1 0;min-width:0}
}
.swatches{overflow:visible}
.sizes{overflow:visible}
.chip{height:46px;min-width:46px;padding:0 12px;border-radius:15px;background:#fff;border:3px solid var(--line);
  display:flex;align-items:center;justify-content:center;gap:5px;font-weight:800;font-size:14px;flex:0 0 auto}
.chip.sel{border-color:var(--berry);background:#ffe9f2;color:var(--berry)}
.chip:active{transform:scale(.93)}
.lbl{font-size:12px;font-weight:900;color:var(--ink-soft);flex:0 0 auto;text-transform:uppercase;letter-spacing:.5px}

/* ---------- stickers ---------- */
#sceneStage{position:absolute;inset:0;overflow:hidden;touch-action:none}
.stk{position:absolute;font-size:64px;line-height:1;transform-origin:50% 50%;
  will-change:transform;filter:drop-shadow(0 3px 4px rgba(0,0,0,.28))}
.stk.sel{outline:4px dashed rgba(36,26,61,.6);outline-offset:6px;border-radius:8px}
.stray{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;padding:2px}
.stray button{width:54px;height:54px;flex:0 0 auto;border-radius:17px;background:var(--sky);font-size:30px;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--line)}
.stray button:active{transform:scale(.9)}
.bgchip{width:48px;height:48px;flex:0 0 auto;border-radius:15px;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.bgchip.sel{box-shadow:0 0 0 4px var(--ink)}

/* ---------- music ---------- */
#musicBody{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;background:#1b1440;color:#fff;padding:9px;gap:9px}
.cattabs{display:flex;gap:7px;flex:0 0 auto;overflow-x:auto;-webkit-overflow-scrolling:touch}
.cattab{height:46px;padding:0 16px;border-radius:15px;background:rgba(255,255,255,.13);
  font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;flex:0 0 auto;white-space:nowrap}
.cattab.sel{background:var(--sun);color:#241a3d}
.pads{flex:1 1 auto;display:grid;gap:8px;min-height:70px}
.pad{border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:28px;color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.22);min-height:52px;padding:4px}
.pad .pn{font-size:11px;font-weight:800;opacity:.95;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.pad.hit{transform:scale(.94);filter:brightness(1.5)}
.seq{flex:1 1 auto;overflow:auto;-webkit-overflow-scrolling:touch;min-height:0}
.seqrow{display:flex;gap:4px;align-items:center;margin-bottom:4px}
.seqname{width:92px;flex:0 0 auto;font-size:12px;font-weight:800;height:34px;border-radius:10px;
  background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;justify-content:center;gap:4px;
  overflow:hidden;white-space:nowrap;padding:0 6px}
.seqname:active{transform:scale(.95)}
.cell{flex:1 1 0;min-width:18px;height:34px;border-radius:8px;background:rgba(255,255,255,.13)}
.cell.beat{background:rgba(255,255,255,.24)}
.cell.on{background:var(--sun);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.cell.play{outline:3px solid #fff}
.mctl{display:flex;gap:7px;align-items:center;flex-wrap:wrap;flex:0 0 auto}
.mctl .act{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.2)}
.mctl .act.go{background:var(--leaf);border-color:transparent}
.mctl .act.warn{background:#ff4d6a;color:#fff;border-color:transparent}
#soundNotice{display:none;align-items:center;justify-content:center;gap:8px;flex:0 0 auto;
  background:var(--sun);color:#241a3d;font-weight:900;font-size:15px;padding:10px;border-radius:14px}
#soundNotice:active{transform:scale(.98)}
.seqdel{width:30px;flex:0 0 auto;height:34px;border-radius:9px;background:rgba(255,255,255,.14);
  color:#fff;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center}
.seqdel:active{transform:scale(.9);background:#ff4d6a}
#songName{width:100%;height:54px;font-size:19px;text-align:center;border-radius:15px;
  border:3px solid var(--line);background:#fff;font-weight:800;margin-bottom:13px;
  -webkit-user-select:text;user-select:text}

/* ---------- animation ---------- */
.strip{flex:0 0 auto;background:#241a3d;padding:7px 9px;display:flex;align-items:center;gap:7px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(7px + env(safe-area-inset-bottom,0px))}
.frm{width:74px;height:56px;flex:0 0 auto;border-radius:12px;background:#fff;border:3px solid transparent;
  position:relative;overflow:hidden;padding:0}
.frm.sel{border-color:var(--sun)}
.frm img{width:100%;height:100%;object-fit:cover;display:block}
.frm span{position:absolute;left:3px;top:2px;font-size:10px;font-weight:900;color:#241a3d;
  background:rgba(255,255,255,.85);border-radius:6px;padding:0 4px}
.strip .act{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.2);height:48px;min-width:48px}
.strip .act.go{background:var(--leaf);border-color:transparent}
.strip .act.warn{background:#ff4d6a;color:#fff;border-color:transparent}
.strip .act.sel{background:var(--sun);color:#241a3d;border-color:transparent}

/* ---------- gallery ---------- */
#galBody{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;background:var(--sky)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:13px}
.gitem{background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);border:2px solid var(--line);display:flex;flex-direction:column;position:relative}
.gitem img{width:100%;height:112px;object-fit:cover;display:block;background:#fff}
.gitem .tag{position:absolute;left:7px;top:7px;background:rgba(36,26,61,.8);color:#fff;font-size:11px;
  font-weight:800;padding:3px 8px;border-radius:9px}
.gitem .when{position:absolute;right:7px;top:7px;background:rgba(255,255,255,.9);color:#5b5175;font-size:10px;
  font-weight:800;padding:3px 7px;border-radius:9px}
.gitem .grow{display:flex;gap:5px;padding:7px}
.gitem .grow button{flex:1 1 0;height:42px;border-radius:13px;background:var(--sky);font-weight:800;font-size:13px}
.gitem .grow button.del{flex:0 0 46px;background:#ffe1e6;color:#c02a4f}
.gitem.picked{outline:4px solid var(--berry);outline-offset:-4px}
.gitem .tick{position:absolute;right:7px;bottom:56px;width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.94);border:3px solid var(--line);display:flex;align-items:center;
  justify-content:center;font-size:19px;font-weight:900;color:transparent}
.gitem.picked .tick{background:var(--berry);border-color:var(--berry);color:#fff}
#selBar{background:var(--ink);color:#fff;display:none;align-items:center;gap:9px;padding:8px 10px;
  flex:0 0 auto;overflow-x:auto}
#selBar.on{display:flex}
#selBar .act{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.25)}
#selBar .act.warn{background:#ff4d6a;color:#fff;border-color:transparent}
#selBar .act.go{background:var(--leaf);border-color:transparent}
#selCount{font-weight:900;font-size:15px;white-space:nowrap;flex:0 0 auto}
.empty{text-align:center;color:var(--ink-soft);padding:50px 20px;font-weight:700;font-size:18px}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(20,14,45,.7);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
#modal.on{display:flex}
.sheet{background:var(--paper);border-radius:24px;padding:20px;max-width:640px;width:100%;
  max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow-lg);text-align:center}
.sheet h2{margin:0 0 6px;font-size:24px;font-weight:900}
.sheet p{margin:0 0 14px;color:var(--ink-soft);font-weight:600;font-size:15px}
.sheet input[type=number]{width:100%;height:58px;font-size:26px;text-align:center;border-radius:15px;
  border:3px solid var(--line);background:#fff;font-weight:900;margin-bottom:13px;-webkit-user-select:text;user-select:text}
.sheetrow{display:flex;gap:9px}
.sheetrow button{flex:1 1 0;height:56px;border-radius:17px;font-weight:900;font-size:17px;background:var(--sky);border:2px solid var(--line)}
.sheetrow button.go{background:var(--leaf);color:#fff;border-color:transparent}
.optgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;margin-bottom:13px}
.optgrid button{border-radius:18px;padding:14px 8px;background:var(--sky);border:3px solid transparent;font-weight:800}
.optgrid button.sel{border-color:var(--grape);background:#efe9ff}
.optgrid .oe{font-size:32px;display:block}
.optgrid .on2{font-size:16px;font-weight:900;display:block;margin-top:3px}
.optgrid .od{font-size:11px;color:var(--ink-soft);display:block;margin-top:2px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;margin-bottom:13px}
.pickgrid button{border-radius:16px;padding:10px 4px;background:var(--sky);border:3px solid transparent;font-weight:800;font-size:12px}
.pickgrid button.sel{border-color:var(--grape);background:#efe9ff}
.pickgrid .pe{font-size:28px;display:block;margin-bottom:2px}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px;margin-bottom:13px}
.tplgrid button{border-radius:16px;background:#fff;border:3px solid var(--line);padding:5px;font-weight:800;font-size:12px}
.tplgrid button canvas{width:100%;height:66px;display:block;border-radius:10px}
.tplgrid button:active{transform:scale(.95)}
.mixrow{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.mixrow label{width:64px;flex:0 0 auto;font-weight:900;font-size:14px;text-align:left}
.mixrow input[type=range]{flex:1 1 auto;height:38px}
#cpPreview{height:52px;border-radius:15px;border:3px solid var(--line);margin-bottom:13px}
/* ---------- slide-out menu ---------- */
#drawer{position:fixed;inset:0;background:rgba(20,14,45,.55);z-index:65;display:none}
#drawer.on{display:block}
#drawerPanel{position:absolute;left:0;top:0;bottom:0;width:min(310px,86vw);background:var(--paper);
  box-shadow:6px 0 30px rgba(36,26,61,.35);padding:14px;overflow-y:auto;
  -webkit-overflow-scrolling:touch;transform:translateX(-100%);transition:transform .22s ease;
  padding-top:calc(14px + env(safe-area-inset-top,0px))}
#drawer.on #drawerPanel{transform:translateX(0)}
#drawerPanel h3{margin:6px 4px 10px;font-size:20px;font-weight:900;color:var(--grape-dark)}
.dgroup{font-size:11px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;
  color:var(--ink-soft);margin:14px 6px 6px}
.ditem{display:flex;align-items:center;gap:12px;width:100%;padding:13px 12px;border-radius:16px;
  background:var(--sky);margin-bottom:7px;font-weight:800;font-size:17px;text-align:left}
.ditem .de{font-size:24px;line-height:1;flex:0 0 auto}
.ditem.cur{background:#efe9ff;border:3px solid var(--grape)}
.ditem:active{transform:scale(.97)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(160%);
  background:var(--ink);color:#fff;padding:13px 20px;border-radius:17px;font-weight:800;font-size:15px;
  z-index:70;transition:transform .25s ease;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}

/* ---------- little mode ---------- */
/* one size for everyone - comfortably tappable on a Fire tablet */
#galBar{background:#fff}

@media (max-height:560px){
  .card{min-height:112px;padding:12px}
  .card .emo{font-size:38px}
  .card .nm{font-size:19px}
  .homehead h1{font-size:28px}
  .homehead{margin-bottom:10px}
}
</style>

<script>
(function(){
"use strict";

/* ============================================================
   Playbox - a single-file creative playground for kids.
   Paint, animate, stickers, music. No network, no accounts,
   no external assets. Saves live in this browser only.
   ============================================================ */

var $ = function(id){ return document.getElementById(id); };
var body = document.body;
var DPR = Math.min(window.devicePixelRatio || 1, 2);

/* ---------- persistence (private mode can throw) ---------- */
/* Nothing here is tied to an account. Everything lives in this browser's
   localStorage, for this site, on this device, under this profile. Ask the
   browser to treat it as persistent so it is not evicted when space runs
   short - that is the single biggest cause of a child losing their work. */
function requestPersistence(){
  try{
    if(navigator.storage && navigator.storage.persist && navigator.storage.persisted){
      navigator.storage.persisted().then(function(already){
        if(!already) navigator.storage.persist();
      });
    }
  }catch(e){}
}

var store = {
  get: function(k, dflt){
    try{ var v = localStorage.getItem('playbox.' + k); return v === null ? dflt : JSON.parse(v); }
    catch(e){ return dflt; }
  },
  set: function(k, v){
    try{ localStorage.setItem('playbox.' + k, JSON.stringify(v)); return true; }catch(e){ return false; }
  },
  del: function(k){ try{ localStorage.removeItem('playbox.' + k); }catch(e){} }
};

var S = {
  screen: 'home',
  age: store.get('age', 'little'),
  color: '#ff4d8d',
  size: 16,
  tool: 'brush',
  shape: 'rect', shapeCat: 'line',
  shapeFill: true,
  customColors: store.get('customColors', []),
  stickers: [], selectedSticker: null, sceneBg: '#bfe8ff',
  frames: [], frameIdx: 0, fps: 5, onion: true, playingAnim: false,
  defaultDur: 0.5, animMusic: false,
  padCat: 'inst', padSound: 'bell',
  galFilter: 'all', galSort: 'new', selMode: false, selIds: [],
  extraSet: null,
  traceFront: false, traceHidden: false, sceneHidden: false,
  zoom: 1, panX: 0, panY: 0,
  panMode: false,
  paintEnv: store.get('paintEnv','none'),
  animEnv: store.get('animEnv','none'),
  sceneEnv: store.get('sceneEnv','none')
};

var PALETTE_LITTLE = ['#ff4d8d','#f7941e','#ffd11a','#22b573','#1e9fe0','#6b3fd6','#8b5a2b','#241a3d'];
var PALETTE_BIG = ['#ff4d8d','#ff7ab6','#f72585','#e02020','#ff6b35','#f7941e','#ffd11a','#e9c46a',
                   '#c6e02a','#22b573','#06d6a0','#0f7a52','#63d0ff','#4cc9f0','#1e9fe0','#118ab2',
                   '#1246a8','#6b3fd6','#b06bff','#7209b7','#8b5a2b','#d9a066','#9aa3b5','#495057',
                   '#241a3d','#ffffff'];
var PALETTE_TEEN = ['#ff2d6f','#f72585','#e63946','#ff6b35','#ffd23f','#e9c46a','#06d6a0','#2a9d8f',
                    '#4cc9f0','#118ab2','#3a0ca3','#7209b7','#b5179e','#560bad','#8d99ae','#495057',
                    '#14121f','#f8f9fa'];
/* Age tiers were removed - everything is available to everyone. These two
   remain as constant false so every previously gated branch takes the
   full-featured path. */
function isLittle(){ return false; }
function isTeen(){ return false; }
function palette(){
  var base = isLittle() ? PALETTE_LITTLE : (isTeen() ? PALETTE_TEEN : PALETTE_BIG);
  return base.concat(S.customColors);
}

/* ---------- toast ---------- */
var toastTimer = null;
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 1900);
}

/* ---------- modal ---------- */
function closeModal(){ $('modal').classList.remove('on'); $('sheet').innerHTML = ''; }
function showModal(html){ $('sheet').innerHTML = html; $('modal').classList.add('on'); }
$('modal').addEventListener('click', function(e){ if(e.target === $('modal')) closeModal(); });

/* A small sum keeps little fingers out of destructive actions.
   Not a security boundary - an older child will solve it. */
/* Deleting used to ask a small sum. Brent's call: children can delete their
   own work, so this just confirms plainly now. */
function grownUpGate(title, onPass){
  showModal('<h2>Delete?</h2><p>' + title + '</p>' +
    '<div class="sheetrow"><button id="gateNo">No, keep it</button>' +
    '<button class="go" id="gateYes">Yes, delete</button></div>');
  $('gateNo').onclick = closeModal;
  $('gateYes').onclick = function(){ closeModal(); onPass(); };
}

function unusedMathGate(title, onPass){
  var a = 3 + Math.floor(Math.random() * 7), b = 4 + Math.floor(Math.random() * 6);
  showModal('<h2>Grown-ups only</h2><p>' + title + '<br>What is <b>' + a + ' &times; ' + b + '</b>?</p>' +
    '<input id="gateIn" type="number" inputmode="numeric" autocomplete="off">' +
    '<div class="sheetrow"><button id="gateNo">Cancel</button><button class="go" id="gateYes">OK</button></div>');
  $('gateNo').onclick = closeModal;
  $('gateYes').onclick = function(){
    if(parseInt($('gateIn').value, 10) === a * b){ closeModal(); onPass(); }
    else { toast('Not quite - try again'); $('gateIn').value = ''; }
  };
  setTimeout(function(){ try{ $('gateIn').focus(); }catch(e){} }, 60);
}

/* ============================================================
   DRAWING ENGINE
   One engine, re-pointed at whichever canvas the current screen
   owns (paint or animate) via bindCanvas().
   ============================================================ */
var DC = null, DX = null;      /* committed canvas + context */
var TC = null, TX = null;      /* trace layer - outlines to colour inside */
var OC = null, OX = null;      /* overlay used for live shape previews */
var undoStacks = { paint: [], anim: [] };
var undoKey = 'paint';
var MAX_UNDO = 8;

function bindCanvas(mainEl, overlayEl, key, traceEl){
  DC = mainEl; DX = mainEl.getContext('2d');
  TC = traceEl || null; TX = TC ? TC.getContext('2d') : null;
  OC = overlayEl; OX = overlayEl ? overlayEl.getContext('2d') : null;
  undoKey = key;
  DX.lineCap = 'round'; DX.lineJoin = 'round';
}

function cssSize(el){
  var r = el.getBoundingClientRect();
  return { w: r.width, h: r.height };
}

/* Resize a canvas stack to its wrapper, keeping what is drawn. */
function fitStack(wrapEl, stackEl, mainEl, others){
  var w = wrapEl.clientWidth - 14, h = wrapEl.clientHeight - 14;
  if(w < 40 || h < 40) return false;

  var prev = null;
  if(mainEl.width > 0 && mainEl.height > 0){
    prev = document.createElement('canvas');
    prev.width = mainEl.width; prev.height = mainEl.height;
    prev.getContext('2d').drawImage(mainEl, 0, 0);
  }

  stackEl.style.width = w + 'px'; stackEl.style.height = h + 'px';
  [mainEl].concat(others || []).forEach(function(c){
    c.style.width = w + 'px'; c.style.height = h + 'px';
    c.width = Math.round(w * DPR); c.height = Math.round(h * DPR);
    c.getContext('2d').setTransform(DPR, 0, 0, DPR, 0, 0);
  });

  var g = mainEl.getContext('2d');
  g.save(); g.setTransform(1,0,0,1,0,0);
  g.clearRect(0, 0, mainEl.width, mainEl.height);
  g.restore();
  if(prev) g.drawImage(prev, 0, 0, w, h);
  g.lineCap = 'round'; g.lineJoin = 'round';
  return true;
}

var redoStacks = { paint: [], anim: [] };

function pushUndo(){
  var c = document.createElement('canvas');
  c.width = DC.width; c.height = DC.height;
  c.getContext('2d').drawImage(DC, 0, 0);
  var st = undoStacks[undoKey];
  st.push(c);
  if(st.length > MAX_UNDO) st.shift();
  redoStacks[undoKey].length = 0;   /* a new edit ends the redo trail */
  refreshUndoButtons();
}

function snapshotCurrent(){
  var c = document.createElement('canvas');
  c.width = DC.width; c.height = DC.height;
  c.getContext('2d').drawImage(DC, 0, 0);
  return c;
}

function paintFrom(c){
  DX.save(); DX.setTransform(1,0,0,1,0,0);
  DX.clearRect(0,0,DC.width,DC.height);
  DX.drawImage(c,0,0);
  DX.restore(); DX.setTransform(DPR,0,0,DPR,0,0);
  DX.lineCap='round'; DX.lineJoin='round';
}

function doRedo(){
  var c = redoStacks[undoKey].pop();
  if(!c){ toast('Nothing to redo'); return; }
  undoStacks[undoKey].push(snapshotCurrent());
  paintFrom(c);
  refreshUndoButtons();
  if(undoKey === 'anim') captureFrame();
  wipDirty[undoKey] = true; wipSchedule();
}


function doUndo(){
  var st = undoStacks[undoKey];
  var c = st.pop();
  if(!c){ toast('Nothing to undo'); return; }
  redoStacks[undoKey].push(snapshotCurrent());
  DX.save(); DX.setTransform(1,0,0,1,0,0);
  DX.clearRect(0,0,DC.width,DC.height);
  DX.drawImage(c,0,0);
  DX.restore(); DX.setTransform(DPR,0,0,DPR,0,0);
  DX.lineCap='round'; DX.lineJoin='round';
  refreshUndoButtons();
  if(undoKey === 'anim') captureFrame();
}

function refreshUndoButtons(){
  var n = undoStacks[undoKey].length, r = redoStacks[undoKey].length;
  if(undoKey === 'paint'){
    if($('undoBtn')) $('undoBtn').disabled = n === 0;
    if($('redoBtn')) $('redoBtn').disabled = r === 0;
  } else {
    if($('animUndo')) $('animUndo').disabled = n === 0;
    if($('animRedo')) $('animRedo').disabled = r === 0;
  }
}

function clearBoard(){
  var s = cssSize(DC);
  DX.save(); DX.setTransform(1,0,0,1,0,0);
  DX.clearRect(0,0,DC.width,DC.height);
  DX.restore(); DX.setTransform(DPR,0,0,DPR,0,0);
  DX.lineCap='round'; DX.lineJoin='round';
  return s;
}

/* flatten a background + art pair into one opaque canvas for saving */
function flatten(bgEl, artEl, traceLayer){
  var c = document.createElement('canvas');
  c.width = artEl.width; c.height = artEl.height;
  var g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0,0,c.width,c.height);
  if(bgEl && bgEl.width && !S.sceneHidden) g.drawImage(bgEl, 0, 0, c.width, c.height);
  var tr = (traceLayer && traceLayer.width && !S.traceHidden) ? traceLayer : null;
  if(tr && !S.traceFront) g.drawImage(tr, 0, 0, c.width, c.height);
  g.drawImage(artEl, 0, 0, c.width, c.height);
  if(tr && S.traceFront) g.drawImage(tr, 0, 0, c.width, c.height);
  return c;
}

/* ---------- brush textures ---------- */
function rnd(n){ return (Math.random() - 0.5) * n; }
var hue = 0, glitterDist = 0;

function line(a,b){ DX.beginPath(); DX.moveTo(a.x,a.y); DX.lineTo(b.x,b.y); DX.stroke(); }

function hexA(hex, a){
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

function star(g, cx, cy, r, color){
  g.fillStyle = color; g.beginPath();
  for(var i = 0; i < 10; i++){
    var rad = (i % 2 === 0) ? r : r * 0.42;
    var ang = (Math.PI/5)*i - Math.PI/2;
    var x = cx + Math.cos(ang)*rad, y = cy + Math.sin(ang)*rad;
    if(i === 0) g.moveTo(x,y); else g.lineTo(x,y);
  }
  g.closePath(); g.fill();
}

function strokeSeg(a, b){
  var w = S.size, c = S.color;
  DX.globalCompositeOperation = 'source-over';
  DX.globalAlpha = 1;
  DX.shadowBlur = 0;
  DX.lineCap = 'round'; DX.lineJoin = 'round';

  switch(S.tool){
    case 'eraser':
      /* cut a hole in the art layer so the scene shows through */
      DX.globalCompositeOperation = 'destination-out';
      DX.strokeStyle = 'rgba(0,0,0,1)'; DX.lineWidth = w * 1.7;
      line(a,b);
      DX.globalCompositeOperation = 'source-over'; break;

    case 'rainbow':
      hue = (hue + 6) % 360;
      DX.strokeStyle = 'hsl(' + hue + ',85%,55%)'; DX.lineWidth = w;
      line(a,b); break;

    case 'crayon':
      /* several jittered translucent passes read as waxy texture */
      DX.strokeStyle = c; DX.globalAlpha = 0.34;
      for(var i = 0; i < 4; i++){
        DX.lineWidth = w * (0.5 + Math.random() * 0.45);
        line({x:a.x+rnd(w*0.45), y:a.y+rnd(w*0.45)}, {x:b.x+rnd(w*0.45), y:b.y+rnd(w*0.45)});
      }
      DX.globalAlpha = 1; break;

    case 'chalk':
      DX.fillStyle = c; DX.globalAlpha = 0.5;
      var d = Math.max(1, Math.sqrt((b.x-a.x)*(b.x-a.x) + (b.y-a.y)*(b.y-a.y)));
      for(var s2 = 0; s2 <= d; s2 += 1.6){
        var t = s2 / d;
        var mx = a.x + (b.x-a.x)*t, my = a.y + (b.y-a.y)*t;
        for(var k = 0; k < 3; k++) DX.fillRect(mx + rnd(w), my + rnd(w), 1.6, 1.6);
      }
      DX.globalAlpha = 1; break;

    case 'marker':
      DX.strokeStyle = c; DX.globalAlpha = 0.32;
      DX.lineCap = 'butt';
      DX.lineWidth = w * 1.5; line(a,b);
      DX.globalAlpha = 1; break;

    case 'pencil':
      DX.strokeStyle = c; DX.globalAlpha = 0.55;
      DX.lineWidth = Math.max(1, w * 0.25);
      line({x:a.x+rnd(1.4), y:a.y+rnd(1.4)}, {x:b.x+rnd(1.4), y:b.y+rnd(1.4)});
      DX.globalAlpha = 1; break;

    case 'water':
      /* soft low-alpha blobs build up like wet paint */
      var grad = DX.createRadialGradient(b.x, b.y, 0, b.x, b.y, Math.max(1, w * 1.6));
      grad.addColorStop(0, hexA(c, 0.14));
      grad.addColorStop(1, hexA(c, 0));
      DX.fillStyle = grad;
      DX.beginPath(); DX.arc(b.x, b.y, Math.max(1, w * 1.6), 0, Math.PI*2); DX.fill();
      break;

    case 'neon':
      DX.shadowColor = c; DX.shadowBlur = w * 1.6;
      DX.strokeStyle = c; DX.lineWidth = w * 0.8; line(a,b);
      DX.shadowBlur = 0;
      DX.strokeStyle = '#ffffff'; DX.lineWidth = Math.max(1, w * 0.22); line(a,b);
      break;

    case 'spray':
      DX.fillStyle = c; DX.globalAlpha = 0.55;
      for(var j = 0; j < 16; j++){
        var ang = Math.random()*Math.PI*2, rad = Math.random()*w;
        DX.fillRect(b.x + Math.cos(ang)*rad, b.y + Math.sin(ang)*rad, 2, 2);
      }
      DX.globalAlpha = 1; break;

    case 'glitter':
      DX.strokeStyle = c; DX.lineWidth = Math.max(2, w*0.45); line(a,b);
      glitterDist += Math.abs(b.x-a.x) + Math.abs(b.y-a.y);
      if(glitterDist > 14){
        glitterDist = 0;
        for(var g2 = 0; g2 < 3; g2++)
          star(DX, b.x + rnd(w*3), b.y + rnd(w*3), Math.max(3, w*0.4),
               'hsl(' + Math.floor(Math.random()*360) + ',95%,68%)');
      }
      break;

    default: /* brush */
      DX.strokeStyle = c; DX.lineWidth = w; line(a,b);
  }
}

/* ---------- shapes ---------- */
var SHAPE_CATS = [
  { id:'line',  name:'Lines',  emoji:'\u3030\uFE0F' },
  { id:'shape', name:'Shapes', emoji:'\u2B1F' },
  { id:'face',  name:'Faces',  emoji:'\uD83D\uDE42' },
  { id:'fun',   name:'Fun',    emoji:'\u2728' }
];

/* Each shape gets the drag rectangle already worked out:
     x,y,w,h  the box, cx,cy its centre, a/b the raw drag points,
     fill     whether the child chose Filled, lw the stroke width.
   Shapes that can sensibly be filled end with done(g,q); the rest stroke. */
function done(g, q){ if(q.fill) g.fill(); else g.stroke(); }

function petal(g, cx, cy, rx, ry, rot){
  g.save(); g.translate(cx, cy); g.rotate(rot);
  g.beginPath(); ellipse(g, 0, 0, rx, ry); g.restore();
}

function shapeById(id){
  for(var i=0;i<SHAPES.length;i++) if(SHAPES[i].id===id) return SHAPES[i];
  return SHAPES[0];
}

function ellipse(g, cx, cy, rx, ry){
  if(g.ellipse){ g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2); return; }
  g.save(); g.translate(cx,cy); g.scale(rx/ry, 1);
  g.arc(0, 0, ry, 0, Math.PI*2); g.restore();
}

function drawShape(g, a, b, kind, fill, color, lw){
  var x = Math.min(a.x,b.x), y = Math.min(a.y,b.y);
  var w = Math.abs(b.x-a.x), h = Math.abs(b.y-a.y);
  var def = shapeById(kind);
  /* A shape's outline used to be drawn at the raw brush width, so a fat
     brush turned a small eye into a solid blob - the strokes were wider
     than the gaps between them. Cap the stroke against the shape's own
     size, tighter for the fiddly ones. */
  var span = Math.min(w, h);
  var cap = span * (def.detail ? 0.075 : 0.16);
  var stroke = Math.max(1.5, Math.min(Math.max(2, lw), cap || 2));
  var q = { x:x, y:y, w:w, h:h, cx:x+w/2, cy:y+h/2,
            a:a, b:b, fill:fill, lw:stroke };
  g.save();
  g.strokeStyle = color; g.fillStyle = color;
  g.lineWidth = q.lw; g.lineCap = 'round'; g.lineJoin = 'round';
  try{ def.draw(g, q); }catch(e){}
  g.restore();
}
/* ---------- flood fill ---------- */
function floodFill(sx, sy, hex){
  var W = DC.width, H = DC.height;
  var x0 = Math.round(sx*DPR), y0 = Math.round(sy*DPR);
  if(x0 < 0 || y0 < 0 || x0 >= W || y0 >= H) return;
  var img;
  try{ img = DX.getImageData(0,0,W,H); }catch(e){ toast('Fill is not available'); return; }
  var d = img.data;
  var si = (y0*W + x0)*4;
  var tr = d[si], tg = d[si+1], tb = d[si+2], ta = d[si+3];
  var fr = parseInt(hex.slice(1,3),16), fg = parseInt(hex.slice(3,5),16), fb = parseInt(hex.slice(5,7),16);
  if(Math.abs(tr-fr)<8 && Math.abs(tg-fg)<8 && Math.abs(tb-fb)<8 && ta===255) return;
  function match(i){
    return Math.abs(d[i]-tr)<40 && Math.abs(d[i+1]-tg)<40 && Math.abs(d[i+2]-tb)<40 && Math.abs(d[i+3]-ta)<40;
  }
  var stack = [[x0,y0]];
  while(stack.length){
    var p = stack.pop(), x = p[0], y = p[1];
    while(y >= 0 && match((y*W+x)*4)) y--;
    y++;
    var rl = false, rr = false;
    while(y < H && match((y*W+x)*4)){
      var i2 = (y*W+x)*4;
      d[i2]=fr; d[i2+1]=fg; d[i2+2]=fb; d[i2+3]=255;
      if(x > 0){
        if(match((y*W+x-1)*4)){ if(!rl){ stack.push([x-1,y]); rl = true; } } else rl = false;
      }
      if(x < W-1){
        if(match((y*W+x+1)*4)){ if(!rr){ stack.push([x+1,y]); rr = true; } } else rr = false;
      }
      y++;
    }
  }
  DX.save(); DX.setTransform(1,0,0,1,0,0); DX.putImageData(img,0,0);
  DX.restore(); DX.setTransform(DPR,0,0,DPR,0,0);
  DX.lineCap='round'; DX.lineJoin='round';
}

/* ---------- pointer plumbing (shared by paint + animate) ---------- */
var drawing = false, last = null, shapeStart = null, panDrag = null;

function localPos(e){
  var r = DC.getBoundingClientRect();
  /* r is the on-screen box, which already includes any zoom, so scale back
     to the canvas's own coordinate space */
  var kx = r.width ? DC.clientWidth / r.width : 1;
  var ky = r.height ? DC.clientHeight / r.height : 1;
  return { x: (e.clientX - r.left) * kx, y: (e.clientY - r.top) * ky };
}

function onDown(e){
  e.preventDefault();
  if(S.playingAnim) return;
  if(S.panMode){
    panDrag = { x:e.clientX, y:e.clientY, panX:S.panX, panY:S.panY };
    drawing = true;
    try{ DC.setPointerCapture(e.pointerId); }catch(err){}
    return;
  }
  var p = localPos(e);

  if(S.tool === 'pick'){
    try{ DC.setPointerCapture(e.pointerId); }catch(err){}
    if(SEL && selHit(p)){
      SEL.grab = { x: p.x - SEL.x, y: p.y - SEL.y };
      drawing = true;
      return;
    }
    if(SEL) stampSel(false);
    pushUndo();
    if(pickAt(p)){ drawSel(); buildShapeBar(); toast('Drag it, or use the buttons'); }
    else { doUndo(); toast('Tap on something you have drawn'); }
    return;
  }

  if(S.tool === 'select'){
    try{ DC.setPointerCapture(e.pointerId); }catch(err){}
    if(SEL && selHit(p)){
      SEL.grab = { x: p.x - SEL.x, y: p.y - SEL.y };
      drawing = true;
      return;
    }
    if(SEL) stampSel(false);          /* clicking away places the current one */
    pushUndo();
    marquee = { x0:p.x, y0:p.y, x1:p.x, y1:p.y };
    drawing = true;
    return;
  }

  pushUndo();

  if(S.tool === 'stamp'){
    var sz = Math.max(28, S.size * 3);
    DX.save();
    DX.textAlign = 'center'; DX.textBaseline = 'middle';
    DX.font = sz + 'px system-ui,"Segoe UI Emoji","Noto Color Emoji",sans-serif';
    DX.fillText(S.stamp || STAMPS[0], p.x, p.y);
    DX.restore();
    afterEdit();
    return;
  }
  if(S.tool === 'fill'){ floodFill(p.x, p.y, S.color); afterEdit(); return; }
  if(S.tool === 'shapes'){ shapeStart = p; drawing = true; try{ DC.setPointerCapture(e.pointerId); }catch(err){} return; }
  drawing = true; last = p; glitterDist = 0;
  try{ DC.setPointerCapture(e.pointerId); }catch(err){}
  strokeSeg(p, { x: p.x + 0.01, y: p.y + 0.01 });
}

function onMove(e){
  if(!drawing) return;
  e.preventDefault();
  if(S.panMode && panDrag){
    S.panX = panDrag.panX + (e.clientX - panDrag.x);
    S.panY = panDrag.panY + (e.clientY - panDrag.y);
    clampPan(); applyView();
    return;
  }
  if(S.tool === 'pick'){
    var pq = localPos(e);
    if(SEL && SEL.grab){ SEL.x = pq.x - SEL.grab.x; SEL.y = pq.y - SEL.grab.y; drawSel(); }
    return;
  }
  if(S.tool === 'select'){
    var q = localPos(e);
    if(SEL && SEL.grab){ SEL.x = q.x - SEL.grab.x; SEL.y = q.y - SEL.grab.y; drawSel(); return; }
    if(marquee){
      marquee.x1 = q.x; marquee.y1 = q.y;
      clearOverlay();
      OX.save();
      OX.strokeStyle = 'rgba(36,26,61,.85)'; OX.lineWidth = 2;
      if(OX.setLineDash) OX.setLineDash([8,6]);
      OX.strokeRect(Math.min(marquee.x0,marquee.x1), Math.min(marquee.y0,marquee.y1),
                    Math.abs(marquee.x1-marquee.x0), Math.abs(marquee.y1-marquee.y0));
      OX.restore();
    }
    return;
  }
  if(S.tool === 'shapes'){
    if(!OX) return;
    var s = cssSize(OC);
    OX.clearRect(0, 0, s.w, s.h);
    drawShape(OX, shapeStart, localPos(e), S.shape, S.shapeFill, S.color, S.size);
    return;
  }
  /* getCoalescedEvents gives smoother lines on high-rate touch panels,
     but it can come back empty - fall back to the event itself. */
  var pts = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  if(!pts || !pts.length) pts = [e];
  for(var i = 0; i < pts.length; i++){
    var p = localPos(pts[i]);
    strokeSeg(last, p);
    last = p;
  }
}

function onUp(e){
  if(!drawing) return;
  if(S.panMode){ panDrag = null; drawing = false; return; }
  if(S.tool === 'pick'){
    drawing = false;
    if(SEL) SEL.grab = null;
    return;
  }
  if(S.tool === 'select'){
    drawing = false;
    if(SEL && SEL.grab){ SEL.grab = null; return; }
    if(marquee){
      var ok = liftSelection(marquee);
      marquee = null;
      clearOverlay();
      if(ok){ drawSel(); toast('Drag to move it'); } else { doUndo(); }
      buildShapeBar();
    }
    return;
  }
  if(S.tool === 'shapes' && shapeStart){
    drawShape(DX, shapeStart, localPos(e), S.shape, S.shapeFill, S.color, S.size);
    if(OX){ var s = cssSize(OC); OX.clearRect(0,0,s.w,s.h); }
    shapeStart = null;
  }
  drawing = false; last = null;
  afterEdit();
}

function onCancel(){
  drawing = false; last = null; shapeStart = null; marquee = null;
  if(SEL) stampSel(false);
  if(OX){ var s = cssSize(OC); OX.clearRect(0,0,s.w,s.h); }
}

function afterEdit(){
  if(S.screen === 'anim'){ captureFrame(); wipDirty.anim = true; }
  else wipDirty.paint = true;
  wipSchedule();
}

function wirePointer(canvasEl){
  canvasEl.addEventListener('pointerdown', onDown);
  canvasEl.addEventListener('pointermove', onMove);
  canvasEl.addEventListener('pointerup', onUp);
  canvasEl.addEventListener('pointercancel', onCancel);
  canvasEl.addEventListener('pointerleave', function(e){ if(drawing && S.tool === 'shapes') onUp(e); });
}

/* Is there anything drawn on the art layer? Sampled, because a full read of
   every pixel on a big canvas is wasted work for a yes/no answer. */
function artHasInk(){
  if(!DC || !DC.width || !DX) return false;
  try{
    var d = DX.getImageData(0, 0, DC.width, DC.height).data;
    for(var i = 3; i < d.length; i += 40){   /* every tenth pixel */
      if(d[i] > 10) return true;
    }
  }catch(e){}
  return false;
}

/* Choosing a trace usually means starting a new picture, but not always -
   sometimes you want to drop an outline under what you have already drawn. */
function startTrace(apply){
  if(!artHasInk()){ apply(); return; }

/* A truly blank page: drawing, trace and scene all cleared. 'Start fresh'

/* ---------- zoom and pan ---------- */
function applyView(){
  var stack = S.screen === 'anim' ? $('animStack') : $('paintStack');
  if(!stack) return;
  stack.style.transform = 'translate(' + S.panX + 'px,' + S.panY + 'px) scale(' + S.zoom + ')';
  var lbl = $('zoomLbl');
  if(lbl) lbl.textContent = Math.round(S.zoom * 100) + '%';
  var pb = $('panBtn');
  if(pb) pb.classList.toggle('sel', S.panMode);
  var fit = $('zoomFit');
  /* nothing to reset when already fitted, so do not invite the tap */
  if(fit) fit.disabled = (S.zoom === 1 && S.panX === 0 && S.panY === 0);
  var zo = $('zoomOut');
  if(zo) zo.disabled = (S.zoom <= 1);
}

function setZoom(z, cx, cy){
  var old = S.zoom;
  S.zoom = Math.max(1, Math.min(6, z));
  if(cx !== undefined){
    /* keep the point under the fingers still */
    var k = S.zoom / old;
    S.panX = cx - (cx - S.panX) * k;
    S.panY = cy - (cy - S.panY) * k;
  }
  clampPan();
  applyView();
}

function clampPan(){
  if(S.zoom <= 1){ S.panX = 0; S.panY = 0; return; }
  var stack = S.screen === 'anim' ? $('animStack') : $('paintStack');
  if(!stack) return;
  var w = stack.clientWidth, h = stack.clientHeight;
  var maxX = w * (S.zoom - 1) / 2, maxY = h * (S.zoom - 1) / 2;
  S.panX = Math.max(-maxX, Math.min(maxX, S.panX));
  S.panY = Math.max(-maxY, Math.min(maxY, S.panY));
}

function resetView(){ S.zoom = 1; S.panX = 0; S.panY = 0; applyView(); }

/* two-finger pinch and drag, tracked on the wrapper so it works whatever
   tool is selected */
function wireGestures(wrapId){
  var wrap = $(wrapId);
  if(!wrap) return;
  var pts = {};
  var base = null;
  function centre(){
    var k = Object.keys(pts);
    var a = pts[k[0]], b = pts[k[1]];
    return { x:(a.x + b.x)/2, y:(a.y + b.y)/2,
             d:Math.sqrt((a.x-b.x)*(a.x-b.x) + (a.y-b.y)*(a.y-b.y)) };
  }
  wrap.addEventListener('pointerdown', function(e){
    pts[e.pointerId] = { x:e.clientX, y:e.clientY };
    if(Object.keys(pts).length === 2){
      onCancel();                 /* a second finger means gesture, not stroke */
      var c = centre();
      base = { d:c.d, zoom:S.zoom, x:c.x, y:c.y, panX:S.panX, panY:S.panY };
    }
  }, true);
  wrap.addEventListener('pointermove', function(e){
    if(!pts[e.pointerId]) return;
    pts[e.pointerId] = { x:e.clientX, y:e.clientY };
    if(Object.keys(pts).length === 2 && base){
      e.preventDefault();
      var c = centre();
      S.panX = base.panX + (c.x - base.x);
      S.panY = base.panY + (c.y - base.y);
      if(base.d > 10) S.zoom = Math.max(1, Math.min(6, base.zoom * (c.d / base.d)));
      clampPan();
      applyView();
    }
  }, true);
  function up(e){
    delete pts[e.pointerId];
    if(Object.keys(pts).length < 2) base = null;
  }
  wrap.addEventListener('pointerup', up, true);
  wrap.addEventListener('pointercancel', up, true);
}
wireGestures('paintWrap');

/* ---------- arrow select: lift whatever you tapped ---------- */

/* True object selection needs an object model, and this is a raster canvas.
   The next best thing, and what a child actually means by 'that bit there',
   is the connected run of ink under the finger. Worked out on a quarter-size
   mask so the flood stays quick on a big canvas. */
function pickAt(p){
  if(!DC || !DC.width) return false;
  var W = DC.width, H = DC.height;
  var img;
  try{ img = DX.getImageData(0, 0, W, H); }catch(e){ return false; }
  var data = img.data;

  var STEP = Math.max(1, Math.round(Math.max(W, H) / 420));
  var mw = Math.ceil(W / STEP), mh = Math.ceil(H / STEP);
  var mask = new Uint8Array(mw * mh);
  for(var my = 0; my < mh; my++){
    for(var mx = 0; mx < mw; mx++){
      var sx = mx * STEP, sy = my * STEP;
      if(data[(sy * W + sx) * 4 + 3] > 12) mask[my * mw + mx] = 1;
    }
  }

  var tx = Math.round(p.x * DPR / STEP), ty = Math.round(p.y * DPR / STEP);
  if(tx < 0 || ty < 0 || tx >= mw || ty >= mh) return false;

  /* a finger rarely lands exactly on a line, so look nearby for ink */
  if(!mask[ty * mw + tx]){
    var best = -1, bd = 1e9;
    var R = 14;
    for(var yy = Math.max(0, ty - R); yy < Math.min(mh, ty + R); yy++){
      for(var xx = Math.max(0, tx - R); xx < Math.min(mw, tx + R); xx++){
        if(!mask[yy * mw + xx]) continue;
        var d2 = (xx - tx) * (xx - tx) + (yy - ty) * (yy - ty);
        if(d2 < bd){ bd = d2; best = yy * mw + xx; }
      }
    }
    if(best < 0) return false;
    tx = best % mw; ty = (best / mw) | 0;
  }

  /* flood the connected region, remembering only its bounds */
  var seen = new Uint8Array(mw * mh);
  var stack = [ty * mw + tx];
  seen[ty * mw + tx] = 1;
  var x0 = tx, x1 = tx, y0 = ty, y1 = ty, count = 0;
  while(stack.length){
    var i = stack.pop();
    count++;
    var cx = i % mw, cy = (i / mw) | 0;
    if(cx < x0) x0 = cx;
    if(cx > x1) x1 = cx;
    if(cy < y0) y0 = cy;
    if(cy > y1) y1 = cy;
    var nb = [i - 1, i + 1, i - mw, i + mw];
    for(var k = 0; k < 4; k++){
      var j = nb[k];
      if(j < 0 || j >= mask.length || seen[j] || !mask[j]) continue;
      if(k === 0 && cx === 0) continue;
      if(k === 1 && cx === mw - 1) continue;
      seen[j] = 1;
      stack.push(j);
    }
  }
  if(count < 3) return false;

  var pad = 2;
  var rect = {
    x0: Math.max(0, (x0 - pad) * STEP) / DPR,
    y0: Math.max(0, (y0 - pad) * STEP) / DPR,
    x1: Math.min(W, (x1 + 1 + pad) * STEP) / DPR,
    y1: Math.min(H, (y1 + 1 + pad) * STEP) / DPR
  };
  return liftSelection(rect);
}
/* ---------- floating selection ---------- */
var SEL = null;         /* {c, x, y, w, h, rot, scale, flip} in CSS pixels */
var marquee = null;

function clearOverlay(){
  if(!OX) return;
  var z = cssSize(OC);
  OX.clearRect(0, 0, z.w, z.h);
}

/* Lift a rectangle off the art layer into a floating selection. The pixels
   are removed from the canvas, so dragging genuinely moves them. */
function liftSelection(r){
  var x = Math.round(Math.min(r.x0, r.x1)), y = Math.round(Math.min(r.y0, r.y1));
  var w = Math.round(Math.abs(r.x1 - r.x0)), h = Math.round(Math.abs(r.y1 - r.y0));
  if(w < 8 || h < 8){ return false; }
  var c = document.createElement('canvas');
  c.width = Math.round(w * DPR); c.height = Math.round(h * DPR);
  var g = c.getContext('2d');
  g.drawImage(DC, Math.round(x*DPR), Math.round(y*DPR), c.width, c.height, 0, 0, c.width, c.height);
  DX.save(); DX.setTransform(1,0,0,1,0,0);
  DX.clearRect(Math.round(x*DPR), Math.round(y*DPR), c.width, c.height);
  DX.restore(); DX.setTransform(DPR,0,0,DPR,0,0);
  DX.lineCap='round'; DX.lineJoin='round';
  SEL = { c:c, x:x + w/2, y:y + h/2, w:w, h:h, rot:0, scale:1, flip:false };
  return true;
}

function selTransform(g){
  g.translate(SEL.x, SEL.y);
  g.rotate(SEL.rot * Math.PI / 180);
  g.scale(SEL.scale * (SEL.flip ? -1 : 1), SEL.scale);
}

function drawSel(){
  if(!OX) return;
  clearOverlay();
  if(!SEL) return;
  OX.save();
  selTransform(OX);
  OX.drawImage(SEL.c, -SEL.w/2, -SEL.h/2, SEL.w, SEL.h);
  OX.strokeStyle = 'rgba(36,26,61,.85)';
  OX.lineWidth = 2;
  if(OX.setLineDash) OX.setLineDash([8,6]);
  OX.strokeRect(-SEL.w/2, -SEL.h/2, SEL.w, SEL.h);
  if(OX.setLineDash) OX.setLineDash([]);
  OX.restore();
}

function stampSel(keepFloating){
  if(!SEL) return;
  DX.save();
  selTransform(DX);
  DX.drawImage(SEL.c, -SEL.w/2, -SEL.h/2, SEL.w, SEL.h);
  DX.restore();
  if(!keepFloating){ SEL = null; clearOverlay(); buildShapeBar(); }
  afterEdit();
}

function selHit(p){
  if(!SEL) return false;
  var dx = p.x - SEL.x, dy = p.y - SEL.y;
  var a = -SEL.rot * Math.PI / 180;
  var lx = (dx*Math.cos(a) - dy*Math.sin(a)) / SEL.scale;
  var ly = (dx*Math.sin(a) + dy*Math.cos(a)) / SEL.scale;
  return Math.abs(lx) <= SEL.w/2 && Math.abs(ly) <= SEL.h/2;
}

function hslToHex(h, s, l){
  s /= 100; l /= 100;
  var k = function(n){ return (n + h/30) % 12; };
  var a = s * Math.min(l, 1-l);
  var f = function(n){
    var v = l - a * Math.max(-1, Math.min(Math.min(k(n)-3, 9-k(n)), 1));
    var hx = Math.round(255*v).toString(16);
    return hx.length < 2 ? '0' + hx : hx;
  };
  return '#' + f(0) + f(8) + f(4);
}

/* ============================================================
   PAPER
   Drawn with plain canvas ops in a centred -0.5..0.5 space so
   they scale to any tablet without any image files.
   ============================================================ */
/* bezier chain: [x0,y0, c1x,c1y,c2x,c2y,x,y, ...] */
/* Manga eye: upper and lower lid arcs meeting at the corners with a large
   iris inside. Drawing a full ellipse plus a small circle instead reads as
   a pair of spectacles, which is what this replaced. */
/* ------------------------------------------------------------------
   Traces shipped in the site's own traces/ folder. Fetched the first
   time the picker opens - never during page load - so the app still
   costs a single request to start. Any failure just means the category
   is empty; nothing else breaks.
   ------------------------------------------------------------------ */
var EXTRA = null;
var extraLoading = false;
function getExtraCount(){ return EXTRA ? EXTRA.length : 0; }

function loadExtraTraces(done){
  if(EXTRA !== null){ done(EXTRA); return; }
  if(extraLoading){ setTimeout(function(){ loadExtraTraces(done); }, 150); return; }
  extraLoading = true;

  /* Only a successful fetch is remembered. Caching a failure meant one slow or
     dropped request left the sets empty for the rest of the session, with no
     way back short of reloading. */
  function ok(list){ EXTRA = list || []; extraLoading = false; done(EXTRA); }
  function fail(){ EXTRA = null; extraLoading = false; done([]); }

  try{
    if(!window.fetch){ fail(); return; }
    fetch('traces/traces.json', { cache: 'no-cache' })
      .then(function(r){ if(!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function(j){
        var list = Array.isArray(j) ? j : (j && j.traces) || [];
        if(list.length) ok(list); else fail();
      })
      .catch(fail);
  }catch(e){ fail(); }
}

/* Line art is usually black on white. Dropping the white to transparent
   keeps the scene visible behind it and leaves the lines to colour in. */
function keyOutWhite(img, w, h){
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var g = c.getContext('2d');
  g.drawImage(img, 0, 0, w, h);
  var d;
  try{ d = g.getImageData(0, 0, w, h); }
  catch(e){ return c; }
  var a = d.data;
  for(var i = 0; i < a.length; i += 4){
    var lum = a[i]*0.299 + a[i+1]*0.587 + a[i+2]*0.114;
    if(lum > 236) a[i+3] = 0;
    else if(lum > 168) a[i+3] = Math.round(a[i+3] * (236 - lum) / 68);
  }
  g.putImageData(d, 0, 0);
  return c;
}

/* 181 traces in one list is unusable, so group them by filename prefix:
   dinosaur-01.png ... dinosaur-30.png become the "Dinosaur" set. */
function extraGroups(){
  var seen = {}, order = [];
  (EXTRA || []).forEach(function(e, i){
    var g = (e.file || '').replace(/-\d+\.[a-z]+$/i, '').replace(/\.[a-z]+$/i, '');
    g = g.replace(/[-_]+/g, ' ').trim() || 'Other';
    g = g.charAt(0).toUpperCase() + g.slice(1);
    if(!seen[g]){ seen[g] = []; order.push(g); }
    seen[g].push(i);
  });
  return { names: order, map: seen };
}

function applyExtraTrace(entry){
  var img = new Image();
  img.onload = function(){
    clearTrace();
    var z = cssSize(DC);
    var sc = Math.min(z.w / img.width, z.h / img.height) * 0.92;  /* breathing room */
    var w = Math.max(1, Math.round(img.width * sc)), h = Math.max(1, Math.round(img.height * sc));
    var keyed = keyOutWhite(img, Math.round(w * DPR), Math.round(h * DPR));
    traceCtx().drawImage(keyed, (z.w - w)/2, (z.h - h)/2, w, h);
    afterEdit();
    toast('Ready to colour!');
  };
  img.onerror = function(){ toast('Could not load that one'); };
  img.src = 'traces/' + encodeURIComponent(entry.file);
}

/* ============================================================
   ENVIRONMENTS
   Full-bleed scenes painted on the background layer, underneath
   whatever the child draws. All drawn in code - no image files.
   ============================================================ */
var ENV_CATS = [
  { id:'nature', name:'Nature',       emoji:'\uD83C\uDF32' },
  { id:'sky',    name:'Sky & space',  emoji:'\uD83C\uDF0C' },
  { id:'places', name:'Places',       emoji:'\uD83C\uDFD9\uFE0F' }
];

function eGrad(g,w,h,stops){
  var gr = g.createLinearGradient(0,0,0,h);
  for(var i=0;i<stops.length;i++) gr.addColorStop(stops[i][0], stops[i][1]);
  g.fillStyle = gr; g.fillRect(0,0,w,h);
}
function eHill(g,w,h,y,amp,phase,color){
  g.fillStyle = color; g.beginPath(); g.moveTo(0,h); g.lineTo(0,y);
  for(var x=0;x<=w;x+=Math.max(4,w/40)) g.lineTo(x, y + Math.sin(x/w*Math.PI*2 + phase)*amp);
  g.lineTo(w,h); g.closePath(); g.fill();
}
function eDisc(g,x,y,r,color){ g.fillStyle=color; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); }
function eCloud(g,x,y,r,color){
  g.fillStyle = color;
  [[0,0,1],[-r*0.8,r*0.15,0.7],[r*0.8,r*0.15,0.72],[-r*0.35,-r*0.35,0.66],[r*0.4,-r*0.3,0.6]]
    .forEach(function(c){ g.beginPath(); g.arc(x+c[0]*1.0, y+c[1], r*c[2], 0, Math.PI*2); g.fill(); });
}
function eTri(g,x,y,bw,bh,color){
  g.fillStyle=color; g.beginPath(); g.moveTo(x,y-bh); g.lineTo(x+bw/2,y); g.lineTo(x-bw/2,y);
  g.closePath(); g.fill();
}
function eStars(g,w,h,n,color,maxR){
  g.fillStyle = color;
  for(var i=0;i<n;i++){
    /* deterministic scatter so the sky does not reshuffle on resize */
    var x=((i*7919)%1000)/1000*w, y=((i*104729)%1000)/1000*h*0.8;
    var r=((i*31)%10)/10*(maxR||1.6)+0.6;
    g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
  }
}
function ePine(g,x,base,ht,wd,c1,c2){
  g.fillStyle=c2; g.fillRect(x-wd*0.09, base-ht*0.16, wd*0.18, ht*0.2);
  g.fillStyle=c1;
  [0,1,2].forEach(function(k){
    var top = base - ht*(0.94 - k*0.22), y = base - ht*(0.42 - k*0.22);
    g.beginPath(); g.moveTo(x, top);
    g.lineTo(x + wd*(0.32 + k*0.11), y); g.lineTo(x - wd*(0.32 + k*0.11), y);
    g.closePath(); g.fill();
  });
}

var ENVIRONMENTS = [
  { id:'none', name:'Plain', cat:'nature', draw:function(g,w,h){
      g.fillStyle='#ffffff'; g.fillRect(0,0,w,h);
    }},
  { id:'meadow', name:'Meadow', cat:'nature', draw:function(g,w,h){
      eGrad(g,w,h,[[0,'#8fd4ff'],[0.55,'#cfeeff'],[0.56,'#8fd96b'],[1,'#4da543']]);
      eDisc(g,w*0.82,h*0.16,Math.min(w,h)*0.09,'#ffe066');
      eCloud(g,w*0.2,h*0.16,Math.min(w,h)*0.06,'rgba(255,255,255,.95)');
      eCloud(g,w*0.55,h*0.1,Math.min(w,h)*0.045,'rgba(255,255,255,.85)');
      eHill(g,w,h,h*0.60,h*0.045,0,'#63bf52');
      eHill(g,w,h,h*0.74,h*0.03,2.2,'#4da543');
      for(var i=0;i<14;i++){
        var x=((i*7919)%1000)/1000*w, y=h*(0.80+((i*37)%20)/100);
        eDisc(g,x,y,Math.min(w,h)*0.012,['#fff','#ffe066','#ff8fb1'][i%3]);
      }
    }},
  { id:'forest', name:'Forest', cat:'nature', draw:function(g,w,h){
      eGrad(g,w,h,[[0,'#bfe3c0'],[0.5,'#8ec894'],[1,'#4a7c52']]);

function envById(id){
  for(var i=0;i<ENVIRONMENTS.length;i++) if(ENVIRONMENTS[i].id === id) return ENVIRONMENTS[i];
  return ENVIRONMENTS[0];
}

/* paint an environment onto a background canvas at its full pixel size */
function renderEnv(canvasEl, envId){
  if(!canvasEl || !canvasEl.width) return;
  var g = canvasEl.getContext('2d');
  g.save(); g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,canvasEl.width,canvasEl.height);
  envById(envId).draw(g, canvasEl.width, canvasEl.height);
  g.restore();
}

function openEnvPicker(current, onPick){
  var cat = ENV_CATS.filter(function(c){ return c.id === envById(current).cat; })[0];
  var sel = cat ? cat.id : 'nature';
  function render(){
    var html = '<h2>Pick a scene</h2><p>The scene sits behind your drawing. Swap it any time - your art stays put.</p><div class="pickgrid">';
    ENV_CATS.forEach(function(c){
      html += '<button data-ecat="' + c.id + '" class="' + (sel===c.id?'sel':'') + '">' +
              '<span class="pe">' + c.emoji + '</span>' + c.name + '</button>';
    });
    html += '</div><div class="tplgrid">';
    ENVIRONMENTS.filter(function(e){ return e.id==='none' || e.cat===sel; }).forEach(function(e){
      html += '<button data-env="' + e.id + '"><canvas width="150" height="100" data-eprev="' + e.id + '"></canvas>' + e.name + '</button>';
    });
    html += '</div><div class="sheetrow"><button id="envNo">Cancel</button></div>';
    showModal(html);
    var prevs = $('sheet').querySelectorAll('canvas[data-eprev]');
    for(var i=0;i<prevs.length;i++) renderEnv(prevs[i], prevs[i].getAttribute('data-eprev'));
    bindAll('[data-ecat]', function(b){ sel = b.getAttribute('data-ecat'); render(); });
    bindAll('[data-env]', function(b){ closeModal(); onPick(b.getAttribute('data-env')); });
    $('envNo').onclick = closeModal;
  }
  render();
}

var PAPERS = [
  { id:'plain', name:'Plain', draw:function(){} },
  { id:'grid',  name:'Grid',  draw:function(g,w,h){
      g.strokeStyle = '#d7dff2'; g.lineWidth = 1;
      for(var x=0;x<w;x+=34){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); }
      for(var y=0;y<h;y+=34){ g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); }
    }},
  { id:'lined', name:'Lined', draw:function(g,w,h){
      g.strokeStyle = '#cfe0f5'; g.lineWidth = 1.5;
      for(var y=40;y<h;y+=38){ g.beginPath(); g.moveTo(14,y); g.lineTo(w-14,y); g.stroke(); }
    }},
  { id:'dots',  name:'Dots',  draw:function(g,w,h){
      g.fillStyle = '#cbd6ee';
      for(var y=22;y<h;y+=30) for(var x=22;x<w;x+=30){ g.beginPath(); g.arc(x,y,2,0,Math.PI*2); g.fill(); }
    }}
];

function renderPaper(g, w, h, paperId){
  var p = PAPERS.filter(function(x){ return x.id === paperId; })[0];
  if(!p || p.id === 'plain') return;
  g.save(); g.setTransform(1,0,0,1,0,0);
  p.draw(g, w, h);
  g.restore();
}

/* An icon per set, keyed by the group name derived from the filenames. */
var SET_ICONS = {
  'Dinosaur':'🦕',
  'Dog':'🐶',
  'Princess':'👑',
  'Anime character':'🧑',
  'Anime character single line':'✏️',
  'Anime outfit':'👕',
  'Example hot air balloon':'🎈'
};
function setIcon(name){ return SET_ICONS[name] || '🖼️'; }

function openTemplates(){
  if(EXTRA === null){                 /* fetch, then open for real */
    loadExtraTraces(function(list){
      if(EXTRA === null && (!list || !list.length)) EXTRA = [];  /* genuinely none */
      openTemplates();
    });
    return;
  }
  var paper = S.tplPaper || 'plain';

  function render(){
    S.tplPaper = paper;
    var grp = extraGroups();
    var mine = store.get('mytraces', []);

    /* every set is a category in its own right, plus your own traces */
    var cats = grp.names.map(function(nm){
      return { id:'set:' + nm, name:nm, emoji:setIcon(nm), count:grp.map[nm].length };
    });
    cats.push({ id:'mine', name:'My Traces', emoji:'\u2B50', count:mine.length });

    if(!S.tplCat || !cats.filter(function(c){ return c.id === S.tplCat; }).length){
      S.tplCat = cats.length ? cats[0].id : 'mine';
    }
    var cat = S.tplCat;

    var html = '<h2>Pick a picture</h2>' +
      '<p>Trace over it and colour it in.</p><div class="pickgrid">';
    cats.forEach(function(c){
      html += '<button data-cat="' + c.id + '" class="' + (cat === c.id ? 'sel' : '') + '">' +
              '<span class="pe">' + c.emoji + '</span>' + c.name + ' (' + c.count + ')</button>';
    });
    html += '</div><p style="margin:10px 0 6px;font-weight:900">Paper</p><div class="pickgrid">';
    PAPERS.forEach(function(p){
      html += '<button data-paper="' + p.id + '" class="' + (paper === p.id ? 'sel' : '') + '">' +
              p.name + '</button>';
    });
    html += '</div><div class="tplgrid">';

    if(cat === 'mine'){
      if(mine.length === 0){
        html += '<div style="grid-column:1/-1;color:#5b5175;font-weight:600;padding:14px;line-height:1.6">' +
                'Nothing here yet. Use <b>\uD83D\uDCF7 Import</b> while painting, drag a box round ' +
                'one drawing, then choose <b>Add to My Traces</b>.</div>';
      }
      mine.forEach(function(it, i){
        html += '<button data-mine="' + i + '"><img src="' + it.data +
                '" style="width:100%;height:66px;object-fit:contain;background:#fff;' +
                'border-radius:10px;display:block">Mine ' + (i+1) + '</button>';
      });
    } else {
      var setName = cat.slice(4);
      var idx = grp.map[setName] || [];
      if(idx.length === 0){
        html += '<div style="grid-column:1/-1;color:#5b5175;font-weight:600;padding:14px;line-height:1.6">' +
                'Nothing here yet. A grown-up can drop pictures into the <b>traces</b> folder ' +
                'of the Playbox project and push them \u2014 they then appear here on every ' +
                'tablet, with nothing to copy across.</div>';
      }
      idx.forEach(function(i){
        var e = EXTRA[i];
        html += '<button data-extra="' + i + '"><img src="traces/' + encodeURIComponent(e.file) +
                '" loading="lazy" style="width:100%;height:66px;object-fit:contain;background:#fff;' +
                'border-radius:10px;display:block">' + e.name + '</button>';
      });
    }

    html += '</div>';
    if(cat === 'mine' && mine.length){
      html += '<div class="sheetrow" style="margin-bottom:10px">' +
              '<button id="mineDel">\uD83D\uDDD1\uFE0F Delete my traces</button></div>';
    }
    html += '<div class="sheetrow">' +
            '<button id="tplBlank">\uD83D\uDCC4 No picture</button>' +
            '<button id="tplNo">Cancel</button></div>';
    showModal(html);

    bindAll('[data-cat]',   function(b){ S.tplCat = b.getAttribute('data-cat'); render(); });
    bindAll('[data-paper]', function(b){ paper = b.getAttribute('data-paper'); render(); });
    bindAll('[data-mine]',  function(b){
      var it = mine[parseInt(b.getAttribute('data-mine'), 10)];
      closeModal();
      startTrace(function(){ applyMyTrace(it); });
    });
    bindAll('[data-extra]', function(b){
      var it = EXTRA[parseInt(b.getAttribute('data-extra'), 10)];
      closeModal();
      startTrace(function(){ applyExtraTrace(it); });
    });
    if($('mineDel')) $('mineDel').onclick = function(){
      grownUpGate('Delete every trace you added?', function(){
        store.del('mytraces'); closeModal(); toast('My Traces cleared');
      });
    };
    $('tplBlank').onclick = function(){
      closeModal();
      startTrace(function(){
        clearTrace();
        if(paper !== 'plain'){
          var g = traceCtx();
          renderPaper(g, (TC||DC).width, (TC||DC).height, paper);
          g.setTransform(DPR,0,0,DPR,0,0);
        }
        toast('Blank page');
        afterEdit();
      });
    };
    $('tplNo').onclick = closeModal;
  }
  render();
}
/* wire every element matching sel inside the open sheet */
function bindAll(sel, fn){
  var els = $('sheet').querySelectorAll(sel);
  for(var i = 0; i < els.length; i++){
    (function(b){ b.addEventListener('click', function(){ fn(b); }); })(els[i]);
  }
}

/* Keep the pinned eraser button lit while the eraser is the chosen tool.
   It used to toggle, so it needed no state of its own; now that it only ever
   turns the eraser on, you need to be able to see that it is on. */
function syncEraseBtn(){
  var on = (S.tool === 'eraser');
  ['eraseBtn','animErase'].forEach(function(id){
    var b = $(id);
    if(b) b.className = 'act' + (on ? ' sel' : '');
  });
}

function pickEraser(){
  /* Holding something with the arrow tool? Then the rubber means 'get rid of
     this'. pickAt pushed an undo step before lifting the pixels, so dropping
     the selection is undoable like anything else. */
  if(SEL){
    SEL = null;
    clearOverlay();
    buildShapeBar();
    afterEdit();
    toast('Rubbed out \u2014 \u21b6 puts it back');
    return;
  }
  /* Not a toggle any more. The button says eraser, so it picks the eraser -
     tapping it twice used to hand you the brush back, which is the opposite
     of what it looks like it does. Pick another tool from the rail to stop. */
  S.tool = 'eraser';
  buildRail('paintRail'); buildRail('animRail'); buildShapeBar();
  toast('Eraser');
}

/* ---------- import any picture, as an outline to trace or as a photo ---------- */
$('importBtn').addEventListener('click', function(){ $('imgIn').click(); });

$('imgIn').addEventListener('change', function(){
  var f = this.files && this.files[0];
  this.value = '';
  if(!f) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){ openCropper(img); };
    img.onerror = function(){ toast('Could not read that picture'); };
    img.src = ev.target.result;
  };
  reader.onerror = function(){ toast('Could not read that picture'); };
  reader.readAsDataURL(f);
});

/* Drag a box over an imported picture to take just one piece of it. A sheet
   with many drawings on it can be cut into one trace at a time this way. */
function openCropper(img){
  var maxW = 520, maxH = 380;
  var sc = Math.min(maxW / img.width, maxH / img.height, 1);
  var vw = Math.round(img.width * sc), vh = Math.round(img.height * sc);

  showModal('<h2>Pick a piece</h2><p>Drag a box around the part you want, or use the ' +
    'whole picture.</p>' +
    '<div style="position:relative;display:inline-block;max-width:100%">' +
      '<canvas id="cropImg" width="' + vw + '" height="' + vh + '" ' +
        'style="max-width:100%;border-radius:12px;border:2px solid var(--line);display:block"></canvas>' +
      '<canvas id="cropBox" width="' + vw + '" height="' + vh + '" ' +
        'style="position:absolute;left:0;top:0;max-width:100%;touch-action:none"></canvas>' +
    '</div>' +
    '<div class="sheetrow" style="margin-top:14px">' +
      '<button id="cropNo">Cancel</button>' +
      '<button id="cropAll">Whole picture</button>' +
      '<button class="go" id="cropUse">Use the box</button></div>');

  var iv = $('cropImg'), ig = iv.getContext('2d');
  ig.drawImage(img, 0, 0, vw, vh);
  var bx = $('cropBox'), bg = bx.getContext('2d');
  var box = null, dragging = false;

  function paint(){
    bg.clearRect(0, 0, vw, vh);
    if(!box) return;
    bg.fillStyle = 'rgba(36,26,61,.35)';
    bg.fillRect(0, 0, vw, vh);
    var x = Math.min(box.x0, box.x1), y = Math.min(box.y0, box.y1);
    var w = Math.abs(box.x1 - box.x0), h = Math.abs(box.y1 - box.y0);
    bg.clearRect(x, y, w, h);
    bg.strokeStyle = '#ff4d8d'; bg.lineWidth = 3;
    bg.strokeRect(x, y, w, h);
  }
  function at(e){
    var r = bx.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (vw / r.width),
             y: (e.clientY - r.top) * (vh / r.height) };
  }
  bx.addEventListener('pointerdown', function(e){
    e.preventDefault();
    var p = at(e);
    box = { x0:p.x, y0:p.y, x1:p.x, y1:p.y };
    dragging = true;
    try{ bx.setPointerCapture(e.pointerId); }catch(err){}
    paint();
  });
  bx.addEventListener('pointermove', function(e){
    if(!dragging) return;
    e.preventDefault();
    var p = at(e);
    box.x1 = p.x; box.y1 = p.y;
    paint();
  });
  bx.addEventListener('pointerup', function(){ dragging = false; });
  bx.addEventListener('pointercancel', function(){ dragging = false; });

  function cropTo(){
    if(!box) return null;
    var x = Math.min(box.x0, box.x1) / sc, y = Math.min(box.y0, box.y1) / sc;
    var w = Math.abs(box.x1 - box.x0) / sc, h = Math.abs(box.y1 - box.y0) / sc;
    if(w < 12 || h < 12) return null;
    var c = document.createElement('canvas');
    c.width = Math.round(w); c.height = Math.round(h);
    c.getContext('2d').drawImage(img, Math.round(x), Math.round(y),
                                 Math.round(w), Math.round(h), 0, 0, c.width, c.height);
    return c;
  }

  $('cropNo').onclick = closeModal;
  $('cropAll').onclick = function(){ closeModal(); chooseImportStyle(img); };
  $('cropUse').onclick = function(){
    var c = cropTo();
    if(!c){ toast('Drag a box first'); return; }
    closeModal(); chooseImportStyle(c);
  };
}

function chooseImportStyle(img){

    'photo to paint over, or save it to your own trace collection.</p><div class="optgrid">' +
    '<button id="impTrace"><span class="oe">\u270F\uFE0F</span><span class="on2">Trace it now</span>' +
      '<span class="od">Outlines only</span></button>' +
    '<button id="impPhoto"><span class="oe">\uD83D\uDDBC\uFE0F</span><span class="on2">Keep the picture</span>' +

/* ---------- My Traces: outlines the user cut out themselves ---------- */
var MAX_TRACES = 24;

function saveMyTrace(img){
  var maxW = 520;
  var sc = Math.min(1, maxW / img.width);
  var w = Math.max(1, Math.round(img.width * sc)), h = Math.max(1, Math.round(img.height * sc));
  var o = toOutline(img, w, h);
  var data;
  try{ data = o.toDataURL('image/png'); }      /* PNG keeps the transparency */
  catch(e){ toast('Could not save that one'); return; }

  var list = store.get('mytraces', []);
  list.unshift({ id: Date.now(), data: data });
  while(list.length > MAX_TRACES) list.pop();
  var ok = store.set('mytraces', list);
  while(!ok && list.length > 1){ list.pop(); ok = store.set('mytraces', list); }
  if(!ok){ toast('No room - delete some traces first'); return; }
  toast('Added to My Traces');
  placeImport(img, true);
}

function applyMyTrace(it){
  var img = new Image();
  img.onload = function(){
    clearTrace();
    var z = cssSize(DC);
    var sc = Math.min(z.w / img.width, z.h / img.height) * 0.92;  /* breathing room */
    var w = img.width * sc, h = img.height * sc;
    traceCtx().drawImage(img, (z.w - w)/2, (z.h - h)/2, w, h);
    afterEdit();
    toast('Ready to colour!');
  };
  img.onerror = function(){ toast('Could not open that one'); };
  img.src = it.data;
}

/* fit the picture inside the canvas without distorting it */
function placeImport(img, asOutline){
  clearTrace();
  var z = cssSize(DC);
  var scale = Math.min(z.w / img.width, z.h / img.height);
  var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
  var x = Math.round((z.w - w) / 2), y = Math.round((z.h - h) / 2);
  var g = traceCtx();
  if(asOutline){
    var o = toOutline(img, Math.max(1, Math.round(w*DPR)), Math.max(1, Math.round(h*DPR)));
    g.drawImage(o, x, y, w, h);
  } else {
    g.drawImage(img, x, y, w, h);
  }
  afterEdit();
  toast(asOutline ? 'Ready to colour!' : 'Picture added');
}

/* Sobel edge detection - turns any picture into dark outlines on a
   transparent layer, so a scene can still show through behind it. */
function toOutline(img, w, h){
  var t = document.createElement('canvas');
  t.width = w; t.height = h;
  var g = t.getContext('2d');
  g.drawImage(img, 0, 0, w, h);
  var src;
  try{ src = g.getImageData(0, 0, w, h).data; }
  catch(e){ toast('Could not read that picture'); return t; }
  var gray = new Float32Array(w * h);
  for(var i = 0, p = 0; p < gray.length; i += 4, p++)
    gray[p] = src[i]*0.299 + src[i+1]*0.587 + src[i+2]*0.114;
  var out = g.createImageData(w, h), o = out.data;
  for(var yy = 1; yy < h-1; yy++){
    for(var xx = 1; xx < w-1; xx++){
      var k = yy*w + xx;
      var gx = -gray[k-w-1] - 2*gray[k-1] - gray[k+w-1] + gray[k-w+1] + 2*gray[k+1] + gray[k+w+1];
      var gy = -gray[k-w-1] - 2*gray[k-w] - gray[k-w+1] + gray[k+w-1] + 2*gray[k+w] + gray[k+w+1];
      if(Math.sqrt(gx*gx + gy*gy) > 55){
        var j = k*4;
        o[j] = 58; o[j+1] = 51; o[j+2] = 80; o[j+3] = 255;
      }
    }
  }
  g.clearRect(0, 0, w, h);
  g.putImageData(out, 0, 0);
  return t;
}

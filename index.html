/* ============================================================
   SCREEN: ANIMATE
   ============================================================ */
function enterAnim(){
  bindCanvas($('animCanvas'), $('animOverlay'), 'anim', $('animTrace'));
  fitStack($('animWrap'), $('animStack'), $('animCanvas'),
           [$('animOverlay'), $('animOnion'), $('animBg'), $('animTrace')]);
  renderEnv($('animBg'), S.animEnv);
  applyView(); applyLayerView();
  buildRail('animRail'); buildColors('animColors'); buildSizes('animSizes');
  wipRestoreAnim(function(restored){
    if(!restored && S.frames.length === 0) S.frames = [blankFrame()];
    if(S.frameIdx >= S.frames.length) S.frameIdx = 0;
    loadFrame(S.frameIdx);
    buildStrip();
    refreshUndoButtons();
    if(restored) toast('Your cartoon is back');
  });
}

function blankFrame(){
  var c = document.createElement('canvas');
  c.width = Math.max(1, $('animCanvas').width);
  c.height = Math.max(1, $('animCanvas').height);
  c.dur = S.defaultDur;   /* seconds this frame is held during playback */
  return c;   /* frames hold art only; the scene lives on its own layer */
}

function frameDur(f){
  var d = f && typeof f.dur === 'number' ? f.dur : S.defaultDur;
  /* 0 is allowed and means "as fast as the screen can go" */
  return Math.max(0, Math.min(15, d));
}
function durLabel(d){
  if(d <= 0) return 'fastest';
  return (d < 1 ? d.toFixed(1) : (Math.round(d*10)/10)) + 's';
}

/* The visible canvas is the scratch surface; every edit is copied
   back into the frame it belongs to. */
function captureFrame(){
  var f = S.frames[S.frameIdx];
  if(!f) return;
  var ac = $('animCanvas');
  if(f.width !== ac.width || f.height !== ac.height){ f.width = ac.width; f.height = ac.height; }
  var g = f.getContext('2d');
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,f.width,f.height);
  g.drawImage(ac, 0, 0);
  updateStripThumb(S.frameIdx);
}

function loadFrame(i){
  S.frameIdx = i;
  var f = S.frames[i];
  var ac = $('animCanvas'), g = ac.getContext('2d');
  g.save(); g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,ac.width,ac.height);
  if(f) g.drawImage(f, 0, 0, ac.width, ac.height);
  g.restore(); g.setTransform(DPR,0,0,DPR,0,0);
  g.lineCap='round'; g.lineJoin='round';
  drawOnion();
  markStripSelection();
}

function drawOnion(){
  var oc = $('animOnion'), g = oc.getContext('2d');
  g.save(); g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,oc.width,oc.height);
  if(S.onion && !S.playingAnim && S.frameIdx > 0){
    var p = S.frames[S.frameIdx - 1];
    if(p) g.drawImage(p, 0, 0, oc.width, oc.height);
  }
  g.restore();
  oc.style.display = (S.onion && !S.playingAnim) ? 'block' : 'none';
}

function frameThumb(f){
  var c = document.createElement('canvas');
  c.width = 74; c.height = 56;
  var g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0,0,74,56);
  if($('animBg').width) g.drawImage($('animBg'), 0, 0, 74, 56);
  if($('animTrace').width && !S.traceHidden && !S.traceFront) g.drawImage($('animTrace'), 0, 0, 74, 56);
  g.drawImage(f, 0, 0, 74, 56);
  if($('animTrace').width && !S.traceHidden && S.traceFront) g.drawImage($('animTrace'), 0, 0, 74, 56);
  try{ return c.toDataURL('image/jpeg', 0.6); }catch(e){ return ''; }
}

function buildStrip(){
  var strip = $('animStrip');
  strip.innerHTML = '';

  S.frames.forEach(function(f, i){
    var b = document.createElement('button');
    b.className = 'frm' + (i === S.frameIdx ? ' sel' : '');
    b.setAttribute('data-frm', i);
    b.innerHTML = '<img alt="Frame ' + (i+1) + '"><span>' + (i+1) + '</span>';
    b.querySelector('img').src = frameThumb(f);
    b.addEventListener('click', function(){
      if(S.playingAnim) return;
      captureFrame();
      undoStacks.anim.length = 0; refreshUndoButtons();
      loadFrame(i); buildStrip();
    });
    strip.appendChild(b);
  });

  function mk(cls, txt, fn, label){
    var b = document.createElement('button');
    b.className = 'act ' + cls; b.textContent = txt;
    if(label) b.setAttribute('aria-label', label);
    b.addEventListener('click', fn);
    strip.appendChild(b);
    return b;
  }
  mk('', '➕', addFrame, 'Add frame');
  mk('', '⧉', dupFrame, 'Copy frame');
  mk('', '⧉×N', openRepeat, 'Repeat this frame several times');
  mk('warn', '🗑️', delFrame, 'Delete frame');
  mk(S.onion ? 'sel' : '', '👁️', function(){
    S.onion = !S.onion; drawOnion(); buildStrip();
  }, 'Show previous frame');
  mk('', '⏱️ ' + durLabel(frameDur(S.frames[S.frameIdx])), openTiming, 'How long this frame holds');
  mk('', '📥', openArtImport, 'Put a saved drawing in this frame');
  mk(S.animMusic ? 'sel' : '', '🎵', function(){
    S.animMusic = !S.animMusic;
    buildStrip();
    toast(S.animMusic ? 'Music will play with your cartoon' : 'Music off');
  }, 'Play music with the cartoon');
  mk('go', S.playingAnim ? '⏸' : '▶', togglePlay, 'Play');
  mk('go', '💾', saveAnimation, 'Save cartoon');
}

/* Hold time for the current frame, 0-15 seconds. */
function openTiming(){
  if(S.playingAnim) return;
  var f = S.frames[S.frameIdx];
  if(!f) return;
  var cur = frameDur(f);
  showModal('<h2>How long does this frame stay?</h2>' +
    '<p>Frame ' + (S.frameIdx + 1) + ' of ' + S.frames.length + '</p>' +
    '<div id="durOut" style="font-size:38px;font-weight:900;margin-bottom:10px">' + durLabel(cur) + '</div>' +
    '<div class="mixrow"><label>Seconds</label>' +
    '<input type="range" id="durIn" min="0" max="15" step="0.1" value="' + cur + '"></div>' +
    '<div class="pickgrid" id="durQuick"></div>' +
    '<div class="sheetrow"><button id="durAll">Use for every frame</button>' +
    '<button class="go" id="durOk">Done</button></div>');
  var inp = $('durIn'), outEl = $('durOut');
  function val(){ return Math.max(0, Math.min(15, parseFloat(inp.value) || 0)); }
  inp.addEventListener('input', function(){ outEl.textContent = durLabel(val()); });
  var quick = $('durQuick');
  [0, 0.2, 0.5, 1, 2, 3, 5, 10, 15].forEach(function(v){
    var b = document.createElement('button');
    b.textContent = durLabel(v);
    b.addEventListener('click', function(){ inp.value = v; outEl.textContent = durLabel(v); });
    quick.appendChild(b);
  });
  $('durOk').onclick = function(){
    f.dur = val(); S.defaultDur = val();
    closeModal(); buildStrip(); toast('Frame holds ' + durLabel(f.dur));
  };
  $('durAll').onclick = function(){
    var v = val();
    S.frames.forEach(function(fr){ fr.dur = v; });
    S.defaultDur = v;
    closeModal(); buildStrip(); toast('Every frame holds ' + durLabel(v));
  };
}

/* Repeat the current frame N times - useful for holding a pose. */
function openRepeat(){
  if(S.playingAnim) return;
  captureFrame();
  var room = 48 - S.frames.length;
  if(room < 1){ toast('That is the most frames (48)'); return; }
  showModal('<h2>Repeat this frame</h2><p>Adds copies straight after it. Room for ' + room + ' more.</p>' +
    '<div id="repOut" style="font-size:38px;font-weight:900;margin-bottom:10px">3</div>' +
    '<div class="mixrow"><label>Copies</label>' +
    '<input type="range" id="repIn" min="1" max="' + Math.min(20, room) + '" step="1" value="' +
      Math.min(3, room) + '"></div>' +
    '<div class="sheetrow"><button id="repNo">Cancel</button>' +
    '<button class="go" id="repOk">Add them</button></div>');
  var inp = $('repIn');
  inp.addEventListener('input', function(){ $('repOut').textContent = inp.value; });
  $('repOut').textContent = inp.value;
  $('repNo').onclick = closeModal;
  $('repOk').onclick = function(){
    var n = Math.max(1, Math.min(room, parseInt(inp.value, 10) || 1));
    var src = S.frames[S.frameIdx];
    for(var i = 0; i < n; i++){
      var c = blankFrame();
      c.getContext('2d').drawImage(src, 0, 0);
      c.dur = frameDur(src);
      S.frames.splice(S.frameIdx + 1 + i, 0, c);
    }
    undoStacks.anim.length = 0; refreshUndoButtons();
    closeModal();
    loadFrame(S.frameIdx + n); buildStrip();
    toast('Added ' + n + (n === 1 ? ' copy' : ' copies'));
  };
}

/* Drop a saved painting or sticker scene into the current frame. */
function openArtImport(){
  if(S.playingAnim) return;
  var items = store.get('gallery', []).filter(function(x){ return x.kind !== 'anim'; });
  if(items.length === 0){ toast('Save a painting first, then it shows up here'); return; }
  var html = '<h2>Put a drawing in this frame</h2><p>Anything you saved in Paint or Stickers.</p><div class="tplgrid">';
  items.forEach(function(it, i){
    html += '<button data-art="' + i + '"><img src="' + it.data +
            '" style="width:100%;height:66px;object-fit:cover;border-radius:10px;display:block">' +
            (it.kind === 'scene' ? 'Stickers' : 'Painting') + '</button>';
  });
  html += '</div><div class="sheetrow"><button id="artNo">Cancel</button></div>';
  showModal(html);
  bindAll('[data-art]', function(b){
    var it = items[parseInt(b.getAttribute('data-art'), 10)];
    var img = new Image();
    img.onload = function(){
      pushUndo();
      var ac = $('animCanvas'), g = ac.getContext('2d');
      var z = cssSize(ac);
      var sc = Math.min(z.w / img.width, z.h / img.height) * 0.92;  /* breathing room */
      var w = img.width * sc, h = img.height * sc;
      g.drawImage(img, (z.w - w)/2, (z.h - h)/2, w, h);
      captureFrame(); buildStrip();
      closeModal(); toast('Added to frame ' + (S.frameIdx + 1));
    };
    img.onerror = function(){ toast('Could not load that one'); };
    img.src = it.data;
  });
  $('artNo').onclick = closeModal;
}

function markStripSelection(){
  var btns = $('animStrip').querySelectorAll('[data-frm]');
  for(var i = 0; i < btns.length; i++)
    btns[i].classList.toggle('sel', +btns[i].getAttribute('data-frm') === S.frameIdx);
}

function updateStripThumb(i){
  var b = $('animStrip').querySelector('[data-frm="' + i + '"]');
  if(b && S.frames[i]) b.querySelector('img').src = frameThumb(S.frames[i]);
}

function addFrame(){
  if(S.playingAnim) return;
  if(S.frames.length >= 48){ toast('That is the most frames (48)'); return; }
  captureFrame();
  S.frames.splice(S.frameIdx + 1, 0, blankFrame());
  undoStacks.anim.length = 0; refreshUndoButtons();
  loadFrame(S.frameIdx + 1); buildStrip(); wipDirty.anim = true; wipSchedule();
  toast('New frame');
}

function dupFrame(){
  if(S.playingAnim) return;
  if(S.frames.length >= 48){ toast('That is the most frames (48)'); return; }
  captureFrame();
  var src = S.frames[S.frameIdx];
  var c = blankFrame();
  c.getContext('2d').drawImage(src, 0, 0);
  S.frames.splice(S.frameIdx + 1, 0, c);
  undoStacks.anim.length = 0; refreshUndoButtons();
  loadFrame(S.frameIdx + 1); buildStrip(); wipDirty.anim = true; wipSchedule();
  toast('Copied frame');
}

function delFrame(){
  if(S.playingAnim) return;
  if(S.frames.length <= 1){ toast('You need at least one frame'); return; }
  S.frames.splice(S.frameIdx, 1);
  if(S.frameIdx >= S.frames.length) S.frameIdx = S.frames.length - 1;
  undoStacks.anim.length = 0; refreshUndoButtons();
  loadFrame(S.frameIdx); buildStrip(); wipDirty.anim = true; wipSchedule();
}

var playTimer = null;
function togglePlay(){
  if(S.playingAnim){ stopPlay(); return; }
  captureFrame();
  if(S.frames.length < 2){ toast('Add another frame first!'); return; }
  S.playingAnim = true;
  drawOnion(); buildStrip();
  if(S.animMusic) startSequencer();

  /* a timeout chain rather than a fixed interval, so each frame can hold
     for its own length of time */
  var i = S.frameIdx;
  function show(n){
    var ac = $('animCanvas'), g = ac.getContext('2d');
    g.save(); g.setTransform(1,0,0,1,0,0);
    g.clearRect(0,0,ac.width,ac.height);
    g.drawImage(S.frames[n], 0, 0, ac.width, ac.height);
    g.restore();
  }
  function step(){
    if(!S.playingAnim) return;
    i = (i + 1) % S.frames.length;
    show(i);
    playTimer = setTimeout(step, Math.max(30, frameDur(S.frames[i]) * 1000));
  }
  playTimer = setTimeout(step, Math.max(30, frameDur(S.frames[i]) * 1000));
}

function stopPlay(){
  if(!S.playingAnim) return;
  S.playingAnim = false;
  clearTimeout(playTimer); playTimer = null;
  stopSequencer();
  loadFrame(S.frameIdx);
  buildStrip();
}

function buildScene(){
  var rail = $('sceneRail');
  rail.innerHTML = '';
  SCENE_BGS.forEach(function(c){
    var b = document.createElement('button');
    b.className = 'bgchip' + (S.sceneBg === c ? ' sel' : '');

    b.addEventListener('click', function(){ S.sceneBg = c; $('sceneStage').style.background = c; buildScene(); });
    rail.appendChild(b);
  });
  [['🔍','Bigger',function(){ scaleSel(1.25); }],
   ['🔎','Smaller',function(){ scaleSel(0.8); }],
   ['🔄','Spin',function(){ rotSel(20); }],
   ['🗑️','Remove',deleteSel]].forEach(function(t){
    var b = document.createElement('button');
    b.className = 'tool';
    b.setAttribute('aria-label', t[1]);
    b.innerHTML = '<span class="ti">' + t[0] + '</span><span class="tl">' + t[1] + '</span>';
    b.addEventListener('click', t[2]);
    rail.appendChild(b);
  });
  var tray = $('stickerTray');
  tray.innerHTML = '';
  STK_BIG.concat(STK_TEEN).forEach(function(emo){
    var b = document.createElement('button');
    b.textContent = emo;
    b.setAttribute('aria-label', 'Add sticker');
    b.addEventListener('click', function(){ addSticker(emo); });

function fitSceneBg(){
  var stage = $('sceneStage'), c = $('sceneBg');
  var w = stage.clientWidth, h = stage.clientHeight;
  if(w < 10 || h < 10) return;
  c.width = Math.round(w * DPR); c.height = Math.round(h * DPR);
  if(S.sceneEnv === 'none'){ c.style.display = 'none'; return; }
  c.style.display = 'block';
  renderEnv(c, S.sceneEnv);
}

function addSticker(emo){
  var stage = $('sceneStage');
  var o = { emo:emo, x:stage.clientWidth/2 + rnd(90), y:stage.clientHeight/2 + rnd(90),
            scale: isLittle() ? 1.25 : 1, rot:0, el:null };
  var el = document.createElement('div');
  el.className = 'stk'; el.textContent = emo;
  o.el = el; stage.appendChild(el);
  S.stickers.push(o);
  placeSticker(o); selectSticker(o); attachDrag(o);
  wipDirty.scene = true; wipSchedule();
}
function placeSticker(o){
  o.el.style.left = o.x + 'px'; o.el.style.top = o.y + 'px';
  o.el.style.transform = 'translate(-50%,-50%) scale(' + o.scale + ') rotate(' + o.rot + 'deg)';
}
function selectSticker(o){
  S.stickers.forEach(function(s){ s.el.classList.remove('sel'); });
  S.selectedSticker = o;
  if(o) o.el.classList.add('sel');
}
function attachDrag(o){
  var dragging = false, offX = 0, offY = 0;
  o.el.addEventListener('pointerdown', function(e){
    e.preventDefault(); e.stopPropagation();
    selectSticker(o);
    var r = $('sceneStage').getBoundingClientRect();
    offX = (e.clientX - r.left) - o.x; offY = (e.clientY - r.top) - o.y;
    dragging = true;
    try{ o.el.setPointerCapture(e.pointerId); }catch(err){}
  });
  o.el.addEventListener('pointermove', function(e){
    if(!dragging) return;
    e.preventDefault();
    var r = $('sceneStage').getBoundingClientRect();
    o.x = (e.clientX - r.left) - offX; o.y = (e.clientY - r.top) - offY;
    placeSticker(o);
  });
  var stop = function(){ dragging = false; wipDirty.scene = true; wipSchedule(); };
  o.el.addEventListener('pointerup', stop);
  o.el.addEventListener('pointercancel', stop);
}
$('sceneStage').addEventListener('pointerdown', function(){ selectSticker(null); });
$('sceneEnvBtn').addEventListener('click', function(){
  openEnvPicker(S.sceneEnv, function(id){
    S.sceneEnv = id; store.set('sceneEnv', id);
    fitSceneBg(); toast('Scene changed');
  });
});

function scaleSel(f){
  var o = S.selectedSticker;
  if(!o){ toast('Tap a sticker first'); return; }
  o.scale = Math.max(0.4, Math.min(5, o.scale*f)); placeSticker(o); wipDirty.scene = true; wipSchedule();
}
function rotSel(d){
  var o = S.selectedSticker;
  if(!o){ toast('Tap a sticker first'); return; }
  o.rot = (o.rot + d) % 360; placeSticker(o); wipDirty.scene = true; wipSchedule();
}
function deleteSel(){
  var o = S.selectedSticker;
  if(!o){ toast('Tap a sticker first'); return; }
  o.el.parentNode.removeChild(o.el);
  S.stickers = S.stickers.filter(function(s){ return s !== o; });
  S.selectedSticker = null;
  wipDirty.scene = true; wipSchedule();
}
$('clearScene').addEventListener('click', function(){
  S.stickers.forEach(function(s){ if(s.el.parentNode) s.el.parentNode.removeChild(s.el); });
  S.stickers = []; S.selectedSticker = null; wipDirty.scene = true; wipSchedule(); toast('Empty scene!');
});

function sceneToCanvas(){
  var stage = $('sceneStage');
  var w = Math.max(1, stage.clientWidth), h = Math.max(1, stage.clientHeight);
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var g = c.getContext('2d');
  g.fillStyle = S.sceneBg; g.fillRect(0,0,w,h);
  if(S.sceneEnv !== 'none' && $('sceneBg').width) g.drawImage($('sceneBg'), 0, 0, w, h);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  S.stickers.forEach(function(s){
    g.save(); g.translate(s.x, s.y); g.rotate(s.rot*Math.PI/180);
    g.font = Math.round(64*s.scale) + 'px system-ui,"Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.fillText(s.emo, 0, 0); g.restore();
  });
  return c;
}

/* ============================================================
   SOUND LIBRARY
   Everything is synthesised with the Web Audio API, so the whole
   library costs zero bytes of download.
   ============================================================ */
var actx = null;
var audioReady = false;

/* A phone starts its audio context suspended, and resume() resolves a moment
   later. Sounds scheduled in between were queued against a clock that was not
   running, so nothing came out. Unlock on the very first gesture anywhere in
   the app, and let play() retry once the context is genuinely running. */
function unlockAudio(){
  var a = audio();
  if(!a) return;
  if(a.state === 'running'){ audioReady = true; return; }
  try{
    var b = a.createBuffer(1, 1, 22050);
    var src = a.createBufferSource();
    src.buffer = b;
    src.connect(a.destination);
    src.start(0);
  }catch(e){}
  if(a.resume){
    a.resume().then(function(){ audioReady = (a.state === 'running'); refreshSoundNotice(); })
              .catch(function(){});
  }
}
document.addEventListener('pointerdown', unlockAudio, true);
document.addEventListener('touchstart', unlockAudio, true);

function soundIsOn(){ return !!(actx && actx.state === 'running'); }

function refreshSoundNotice(){
  var el = $('soundNotice');
  if(!el) return;
  el.style.display = soundIsOn() ? 'none' : 'flex';
}

function audio(){
  if(!actx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    try{ actx = new AC(); }catch(e){ return null; }
  }
  if(actx.state === 'suspended'){ try{ actx.resume(); }catch(e){} }
  return actx;
}

function sound(id){
  for(var i = 0; i < SOUNDS.length; i++) if(SOUNDS[i].id === id) return SOUNDS[i];
  return SOUNDS[0];
}

/* Pentatonic: any combination sounds pleasant, so a child mashing
   pads never produces a wrong note. */
var NOTES = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
var PAD_COLORS = ['#ff4d8d','#f7941e','#ffd11a','#22b573','#1e9fe0','#6b3fd6','#b06bff','#ff7ab6'];

function noiseSrc(a, dur){
  var len = Math.max(1, Math.floor(a.sampleRate * dur));
  var buf = a.createBuffer(1, len, a.sampleRate);
  var ch = buf.getChannelData(0);
  for(var i = 0; i < len; i++) ch[i] = (Math.random()*2 - 1) * (1 - i/len);
  var src = a.createBufferSource(); src.buffer = buf;
  return src;
}

function play(id, freq, when){
  var a = audio();
  if(!a) return;
  if(a.state !== 'running'){
    /* not awake yet - wake it and sound the note the moment it is */
    if(a.resume) a.resume().then(function(){
      refreshSoundNotice();
      if(a.state === 'running') play(id, freq, 0);
    }).catch(function(){});
    return;
  }
  var t = when || a.currentTime;
  var s = sound(id);
  if(s.drum) return playDrum(a, s.drum, t);
  if(s.fx)   return playFx(a, s.fx, t);

  var f = (freq || NOTES[0]) * Math.pow(2, s.octave || 0);

  if(s.pluck){                      /* plucked string: filtered noise burst */
    var n = noiseSrc(a, 0.02);
    var bp = a.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 12;
    var dl = a.createDelay(); dl.delayTime.value = 1 / f;
    var fb = a.createGain(); fb.gain.value = 0.86;
    var pg = a.createGain();
    pg.gain.setValueAtTime(s.gain, t);
    pg.gain.exponentialRampToValueAtTime(0.0001, t + s.decay);
    n.connect(bp); bp.connect(dl); dl.connect(fb); fb.connect(dl);
    dl.connect(pg); bp.connect(pg); pg.connect(a.destination);
    n.start(t);
    setTimeout(function(){ try{ fb.disconnect(); }catch(e){} }, (s.decay + 0.3) * 1000);
    return;
  }

  var osc = a.createOscillator(), g = a.createGain();
  osc.type = s.type; osc.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(s.gain, t + (s.bow ? 0.22 : (s.soft ? 0.09 : 0.012)));
  g.gain.exponentialRampToValueAtTime(0.0001, t + s.decay);
  osc.connect(g); g.connect(a.destination);
  osc.start(t); osc.stop(t + s.decay + 0.05);

  /* a quiet octave above gives marimba and music box their ring */
  if(s.id === 'marimba' || s.id === 'box'){
    var o2 = a.createOscillator(), g2 = a.createGain();
    o2.type = 'sine'; o2.frequency.setValueAtTime(f*2, t);
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(s.gain*0.35, t + 0.01);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + s.decay*0.6);
    o2.connect(g2); g2.connect(a.destination);
    o2.start(t); o2.stop(t + s.decay);
  }
}

function playDrum(a, kind, t){
  if(kind === 'kick' || kind === 'tom'){
    var hi = kind === 'kick' ? 150 : 220, lo = kind === 'kick' ? 45 : 90;
    var o = a.createOscillator(), g = a.createGain();
    o.frequency.setValueAtTime(hi, t);
    o.frequency.exponentialRampToValueAtTime(lo, t + 0.16);
    g.gain.setValueAtTime(0.6, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.26);
    return;
  }
  if(kind === 'hat'){
    var n = noiseSrc(a, 0.06), hp = a.createBiquadFilter(), g2 = a.createGain();
    hp.type='highpass'; hp.frequency.value = 7000; g2.gain.value = 0.2;
    n.connect(hp); hp.connect(g2); g2.connect(a.destination); n.start(t);
    return;
  }
  if(kind === 'snare'){
    var n2 = noiseSrc(a, 0.16), hp2 = a.createBiquadFilter(), g3 = a.createGain();
    hp2.type='highpass'; hp2.frequency.value = 1400; g3.gain.value = 0.26;
    n2.connect(hp2); hp2.connect(g3); g3.connect(a.destination); n2.start(t);
    var o2 = a.createOscillator(), g4 = a.createGain();
    o2.type='triangle'; o2.frequency.setValueAtTime(190, t);
    g4.gain.setValueAtTime(0.22, t); g4.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o2.connect(g4); g4.connect(a.destination); o2.start(t); o2.stop(t + 0.14);
    return;
  }
  if(kind === 'clap'){
    [0, 0.018, 0.036].forEach(function(d){
      var n3 = noiseSrc(a, 0.07), bp = a.createBiquadFilter(), g5 = a.createGain();
      bp.type='bandpass'; bp.frequency.value = 1600; g5.gain.value = 0.17;
      n3.connect(bp); bp.connect(g5); g5.connect(a.destination); n3.start(t + d);
    });
    return;
  }
  /* cowbell */
  [540, 800].forEach(function(fq){
    var o3 = a.createOscillator(), g6 = a.createGain();
    o3.type='square'; o3.frequency.setValueAtTime(fq, t);
    g6.gain.setValueAtTime(0.09, t); g6.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    o3.connect(g6); g6.connect(a.destination); o3.start(t); o3.stop(t + 0.3);
  });
}

function playFx(a, kind, t){
  var o, g, n, f;
  switch(kind){
    case 'boing':
      o = a.createOscillator(); g = a.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(560, t);
      o.frequency.exponentialRampToValueAtTime(300, t + 0.07);
      o.frequency.exponentialRampToValueAtTime(230, t + 0.15);
      o.frequency.exponentialRampToValueAtTime(160, t + 0.23);
      o.frequency.exponentialRampToValueAtTime(120, t + 0.34);
      g.gain.setValueAtTime(0.3, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.42); break;

    case 'zap':
      o = a.createOscillator(); g = a.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(1400, t);
      o.frequency.exponentialRampToValueAtTime(90, t + 0.18);
      g.gain.setValueAtTime(0.24, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.22); break;

    case 'pop':
      o = a.createOscillator(); g = a.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(320, t);
      o.frequency.exponentialRampToValueAtTime(920, t + 0.055);
      g.gain.setValueAtTime(0.34, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.1); break;

    case 'whoosh':
      n = noiseSrc(a, 0.5); f = a.createBiquadFilter(); g = a.createGain();
      f.type = 'bandpass'; f.Q.value = 1.4;
      f.frequency.setValueAtTime(300, t);
      f.frequency.exponentialRampToValueAtTime(3600, t + 0.28);
      f.frequency.exponentialRampToValueAtTime(400, t + 0.5);
      g.gain.value = 0.3;
      n.connect(f); f.connect(g); g.connect(a.destination); n.start(t); break;

    case 'laser':
      o = a.createOscillator(); g = a.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(1800, t);
      o.frequency.exponentialRampToValueAtTime(180, t + 0.26);
      g.gain.setValueAtTime(0.14, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.3); break;

    case 'magic':
      [0,0.06,0.12,0.18,0.24].forEach(function(d, i){
        var oo = a.createOscillator(), gg = a.createGain();
        oo.type = 'sine'; oo.frequency.setValueAtTime(700 + i*260, t + d);
        gg.gain.setValueAtTime(0.0001, t + d);
        gg.gain.exponentialRampToValueAtTime(0.18, t + d + 0.01);
        gg.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.22);
        oo.connect(gg); gg.connect(a.destination);
        oo.start(t + d); oo.stop(t + d + 0.24);
      }); break;

    case 'siren':
      o = a.createOscillator(); g = a.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(620, t);
      o.frequency.linearRampToValueAtTime(980, t + 0.25);
      o.frequency.linearRampToValueAtTime(620, t + 0.5);
      o.frequency.linearRampToValueAtTime(980, t + 0.75);
      g.gain.setValueAtTime(0.16, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.92); break;

    default: /* drip */
      o = a.createOscillator(); g = a.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(900, t);
      o.frequency.exponentialRampToValueAtTime(2400, t + 0.07);
      g.gain.setValueAtTime(0.22, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.14);
  }
}

  }

}

  var prev = gridUndo.pop();
  if(!prev){ toast('Nothing to undo'); return; }
  grid = prev.g; seqRows = prev.rows;
  store.set('grid', grid); store.set('seqRows', seqRows);
  buildSeq(); buildMusicControls();

function startSequencer(){
  if(!audio()){ toast('Sound is not available'); return; }
  seqOn = true; seqStep = 0;
  var interval = (60/bpm) * 1000 / 4;
  seqTimer = setInterval(function(){
    var cells = document.querySelectorAll('#seq .cell');
    for(var i = 0; i < cells.length; i++) cells[i].classList.remove('play');
    for(var ri = 0; ri < seqRows.length; ri++){
      var cell = document.querySelector('#seq .cell[data-r="' + ri + '"][data-s="' + seqStep + '"]');
      if(cell) cell.classList.add('play');
      if(grid[ri][seqStep]) play(seqRows[ri], NOTES[2 + (ri % 4)]);
    }
    seqStep = (seqStep + 1) % STEPS;
  }, interval);
}

function stopSequencer(){
  seqOn = false;
  clearInterval(seqTimer); seqTimer = null;
  var cells = document.querySelectorAll('#seq .cell');
  for(var i = 0; i < cells.length; i++) cells[i].classList.remove('play');
}

var MAX_SAVES = 48;

function thumbData(canvas, maxW){
  var scale = Math.min(1, (maxW || 640) / canvas.width);
  var out = document.createElement('canvas');
  out.width = Math.max(1, Math.round(canvas.width * scale));
  out.height = Math.max(1, Math.round(canvas.height * scale));
  var g = out.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0,0,out.width,out.height);
  g.drawImage(canvas, 0, 0, out.width, out.height);
  try{ return out.toDataURL('image/jpeg', 0.78); }catch(e){ return null; }
}

function commitSave(item){
  var items = store.get('gallery', []);
  items.unshift(item);
  while(items.length > MAX_SAVES) items.pop();
  var ok = store.set('gallery', items);
  while(!ok && items.length > 1){ items.pop(); ok = store.set('gallery', items); }
  if(ok) toast('Saved to My Stuff!');
  else toast('Storage is full - delete something in My Stuff');
}

function saveToGallery(canvas, kind){
  var data = thumbData(canvas, 640);
  if(!data){ toast('Could not save this one'); return; }
  commitSave({ id: Date.now(), kind: kind, data: data });
}

function saveAnimation(){
  captureFrame();
  if(S.frames.length < 2){ toast('Add another frame first!'); return; }
  var frames = [];
  for(var i = 0; i < S.frames.length; i++){
    var d = thumbData(flatten($('animBg'), S.frames[i], $('animTrace')), 320);
    if(!d){ toast('Could not save this one'); return; }
    frames.push(d);
  }
  var durs = S.frames.map(function(f){ return frameDur(f); });
  commitSave({ id: Date.now(), kind: 'anim', data: frames[0], frames: frames,
               fps: S.fps, durs: durs });
}

function whenMade(ts){
  var diff = Date.now() - ts;
  var day = 86400000;
  if(diff < day) return 'Today';
  if(diff < day*2) return 'Yesterday';
  if(diff < day*7) return Math.floor(diff/day) + ' days ago';
  var d = new Date(ts);
  return d.getDate() + '/' + (d.getMonth()+1);
}

function visibleItems(){

  var items = all.filter(function(x){ return S.galFilter === 'all' || x.kind === S.galFilter; });

    if(a.kind === b.kind) return b.id - a.id;
    return a.kind < b.kind ? -1 : 1;
  });
  else items = items.slice().sort(function(a,b){ return b.id - a.id; });
  return items;
}

function dataURLtoFile(dataURL, name){
  var parts = dataURL.split(',');
  var mime = (parts[0].match(/:(.*?);/) || [null,'image/jpeg'])[1];
  var bin = atob(parts[1]);
  var arr = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  try{ return new File([arr], name, { type: mime }); }
  catch(e){ return new Blob([arr], { type: mime }); }
}

/* Web Share where the browser supports it. Amazon's kids browser very likely
   does not, so the fallback shows the pictures full size with instructions

  var all = store.get('gallery', []);

  var html = '<h2>Save or share</h2><p>This browser cannot hand pictures to other apps. ' +
             'Press and hold a picture to save it, then share it from your photos.</p>';

/* Report how much room is left and whether the browser promised to keep it. */
function describeStorage(){
  var el = $('storeNote');
  if(!el) return;
  var base = 'Saved in this browser on this tablet only \u2014 no account needed. ';
  try{
    if(navigator.storage && navigator.storage.estimate){
      navigator.storage.estimate().then(function(est){
        var used = est.usage ? (est.usage/1048576).toFixed(1) : '?';
        var cap  = est.quota ? (est.quota/1048576).toFixed(0) : '?';
        var msg = base + 'Using ' + used + ' MB of about ' + cap + ' MB.';
        if(navigator.storage.persisted){
          navigator.storage.persisted().then(function(p){
            el.textContent = msg + (p ? ' The tablet has been asked to keep it safe.'
                                      : ' Back up now and then, just in case.');
          });
        } else el.textContent = msg;
      });
    }
  }catch(e){}
}

/* ============================================================
   WORK IN PROGRESS
   Explicit saves already survived a restart. What did not was whatever was
   on the canvas at the time - so a child who drew for twenty minutes and
   closed the tab lost the lot. Snapshot it shortly after each edit, and put
   it back the first time the screen is opened.
   ============================================================ */
var wipTimer = null;
var wipDone = { paint:false, anim:false, scene:false };
/* Which areas changed since the last snapshot. The save is debounced, so by
   the time it runs the child may already be on another screen - keying off
   S.screen meant a drawing was lost if they switched within the delay. */
var wipDirty = { paint:false, anim:false, scene:false };

/* PNG, not JPEG: the art layer is transparent so the scene shows through, and
   JPEG would bake a white background into it. */
function canvasPNG(c, maxW){
  if(!c || !c.width) return null;
  var scale = Math.min(1, maxW / c.width);
  var o = document.createElement('canvas');
  o.width = Math.max(1, Math.round(c.width * scale));
  o.height = Math.max(1, Math.round(c.height * scale));
  o.getContext('2d').drawImage(c, 0, 0, o.width, o.height);
  try{ return o.toDataURL('image/png'); }catch(e){ return null; }
}

function wipSave(){
  if(!wipDirty.paint && !wipDirty.anim && !wipDirty.scene) return;
  var w = store.get('wip', {}) || {};
  try{
    if(wipDirty.paint){
      var d = canvasPNG($('paintCanvas'), 800);
      if(d) w.paint = { data:d, env:S.paintEnv,
                        trace: canvasPNG($('paintTrace'), 800),
                        front: !!S.traceFront };
    }
    if(wipDirty.anim && S.frames.length){
      captureFrame();
      var fr = [], ok = true;
      for(var i = 0; i < S.frames.length; i++){
        var t = canvasPNG(S.frames[i], 300);
        if(!t){ ok = false; break; }
        fr.push(t);
      }
      if(ok) w.anim = { frames:fr, durs:S.frames.map(frameDur),
                        idx:S.frameIdx, env:S.animEnv };
    }
    if(wipDirty.scene){
      w.scene = { env:S.sceneEnv, bg:S.sceneBg,
        items: S.stickers.map(function(o){
          return { e:o.emo, x:Math.round(o.x), y:Math.round(o.y),
                   s:Math.round(o.scale*100)/100, r:o.rot };
        }) };
    }
  }catch(e){ return; }

  if(!store.set('wip', w)){
    /* out of room - the cartoon is by far the biggest part, drop it first */
    delete w.anim;
    store.set('wip', w);
  }
  wipDirty.paint = wipDirty.anim = wipDirty.scene = false;
}

function wipSchedule(){
  clearTimeout(wipTimer);
  wipTimer = setTimeout(wipSave, 1200);
}

/* Mobile browsers often kill a tab without firing unload, so snapshot on the
   way out as well as on a timer. */
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden'){ clearTimeout(wipTimer); wipSave(); }
});
window.addEventListener('pagehide', wipSave);

function wipRestorePaint(){
  if(wipDone.paint) return;
  wipDone.paint = true;
  var w = store.get('wip', {}) || {};
  if(!w.paint || !w.paint.data) return;
  if(w.paint.env){                  /* the scene it was drawn against */
    S.paintEnv = w.paint.env;
    renderEnv($('paintBg'), S.paintEnv);
  }
  S.traceFront = !!w.paint.front;
  applyLayerView();
  if(w.paint.trace){
    var ti = new Image();
    ti.onload = function(){ var z = cssSize(DC); traceCtx().drawImage(ti, 0, 0, z.w, z.h); };
    ti.src = w.paint.trace;
  }
  var img = new Image();
  img.onload = function(){
    var z = cssSize(DC);
    DX.drawImage(img, 0, 0, z.w, z.h);
    wipDirty.paint = false;      /* putting it back is not an edit */
    toast('Picked up where you left off');
  };
  img.src = w.paint.data;
}

function wipRestoreAnim(done){
  if(wipDone.anim){ done(false); return; }
  wipDone.anim = true;
  var w = store.get('wip', {}) || {};
  if(!w.anim || !w.anim.frames || !w.anim.frames.length){ done(false); return; }
  var srcs = w.anim.frames, loaded = 0;
  var frames = srcs.map(function(){ return blankFrame(); });
  srcs.forEach(function(src, i){
    var im = new Image();
    im.onload = function(){
      var g = frames[i].getContext('2d');
      g.setTransform(1,0,0,1,0,0);
      g.clearRect(0,0,frames[i].width,frames[i].height);
      g.drawImage(im, 0, 0, frames[i].width, frames[i].height);
      if(w.anim.durs && typeof w.anim.durs[i] === 'number') frames[i].dur = w.anim.durs[i];
      if(++loaded === srcs.length){
        S.frames = frames;         /* replaces, never appends */
        S.frameIdx = Math.min(w.anim.idx || 0, frames.length - 1);
        wipDirty.anim = false;
        if(w.anim.env){ S.animEnv = w.anim.env; renderEnv($('animBg'), S.animEnv); }
        done(true);
      }
    };
    im.onerror = function(){ if(++loaded === srcs.length){ S.frames = frames; done(true); } };
    im.src = src;
  });
}

function wipRestoreScene(){
  if(wipDone.scene) return;
  wipDone.scene = true;
  var w = store.get('wip', {}) || {};
  if(!w.scene || !w.scene.items || !w.scene.items.length) return;
  if(w.scene.bg) S.sceneBg = w.scene.bg;
  if(w.scene.env) S.sceneEnv = w.scene.env;
  /* replace, never append - restoring twice must not double the scene */
  S.stickers.forEach(function(o){ if(o.el.parentNode) o.el.parentNode.removeChild(o.el); });
  S.stickers = [];
  w.scene.items.forEach(function(it){
    addSticker(it.e);
    var o = S.stickers[S.stickers.length - 1];
    o.x = it.x; o.y = it.y; o.scale = it.s; o.rot = it.r;
    placeSticker(o);
  });
  selectSticker(null);
  wipDirty.scene = false;        /* putting it back is not an edit */
  toast('Your scene is back');
}

/* ---------- keeping Playbox on the tablet ---------- */

/* Ask the worker something and get one reply. Nothing here is essential, so
   every path resolves rather than rejects - a tablet that will not talk to us
   should show 'not saved yet', not a broken screen. */
function swAsk(msg, onReply, onProgress){
  var reg = navigator.serviceWorker && navigator.serviceWorker.controller;
  if(!reg){ onReply(null); return; }
  var ch = new MessageChannel();
  ch.port1.onmessage = function(e){
    var d = e.data || {};
    if(d.state === 'progress'){ if(onProgress) onProgress(d); return; }
    onReply(d);
  };
  try{ navigator.serviceWorker.controller.postMessage(msg, [ch.port2]); }
  catch(err){ onReply(null); }
}

function prettyBytes(n){
  if(!n && n !== 0) return '';
  if(n < 1024*1024) return Math.round(n/1024) + ' KB';
  return (n/(1024*1024)).toFixed(n < 10*1024*1024 ? 1 : 0) + ' MB';
}

function offlineSupported(){
  return !!(navigator.serviceWorker && window.caches && window.isSecureContext !== false);
}

function openOffline(){
  var total = (getExtraCount() || 0);

  function paint(body, row){
    showModal('<h2>\uD83D\uDCF6 Use without wifi</h2>' + body +
      '<div class="sheetrow">' + row + '</div>');
    if($('offDone')) $('offDone').onclick = closeModal;
  }

  if(!offlineSupported()){
    paint('<p>This browser cannot keep Playbox on the tablet, so it will need ' +
          'wifi each time. Everything you have made is still saved on the ' +
          'device and will be waiting when you come back.</p>',
          '<button class="go" id="offDone">Close</button>');
    return;
  }

  var ready = !!(navigator.serviceWorker && navigator.serviceWorker.controller);

  swAsk({ cmd:'art-status' }, function(d){
    var have = (d && d.cached) || 0;
    var est = '';
    function draw(){
      var status = ready
        ? '<p><b>Playbox itself: saved.</b> It will open with no internet.</p>'
        : '<p><b>Nearly there.</b> Close Playbox and open it once more, then ' +
          'come back here - the tablet finishes saving the app in the background.</p>';
      var pics = total
        ? '<p>Pictures to trace: <b>' + have + ' of ' + total + '</b> saved.' +
          (have >= total ? ' All of them are ready.' : '') + '</p>'
        : '';
      var note = '<p style="color:#5b5175;font-size:14px;line-height:1.6">' +
        'Playbox saves these by itself a few seconds after it opens, so this ' +
        'usually needs no help. All 181 pictures come to about 2 MB.' +
        est + '</p>';
      var row = (have >= total && total)
        ? '<button id="offDrop">Remove pictures</button>' +
          '<button class="go" id="offDone">Close</button>'
        : '<button id="offDone">Close</button>' +
          '<button class="go" id="offGet">Save them now</button>';
      paint(status + pics + note, row);
      if($('offGet')) $('offGet').onclick = saveAll;
      if($('offDrop')) $('offDrop').onclick = function(){
        swAsk({ cmd:'drop-art' }, function(){ closeModal(); toast('Pictures removed'); });
      };
    }

    if(navigator.storage && navigator.storage.estimate){
      navigator.storage.estimate().then(function(e){
        if(e && e.usage) est = ' Using about ' + prettyBytes(e.usage) + ' on the tablet.';
        draw();
      })['catch'](draw);
    } else draw();
  });

  function saveAll(){
    loadExtraTraces(function(list){
      if(!list || !list.length){
        paint('<p>There are no pictures to save yet. Open Trace once while ' +
              'you have wifi, then come back.</p>',
              '<button class="go" id="offDone">Close</button>');
        return;
      }
      var urls = list.map(function(e){ return 'traces/' + encodeURIComponent(e.file); });
      var n = urls.length;
      function bar(done, failed){
        var pct = Math.round(done / n * 100);
        paint('<p>Saving pictures to the tablet\u2026 <b>' + done + ' of ' + n + '</b></p>' +
              '<div style="height:18px;border-radius:9px;background:#eef3ff;overflow:hidden">' +
              '<div style="height:100%;width:' + pct + '%;background:#22b573"></div></div>' +
              (failed ? '<p style="color:#c02a4f;font-size:14px">' + failed +
                        ' could not be fetched \u2014 try again on a better connection.</p>' : '') +
              '<p style="color:#5b5175;font-size:14px">Keep this screen open until it finishes.</p>',
              '');
      }
      bar(0, 0);
      swAsk({ cmd:'precache-art', urls:urls }, function(d){
        var failed = (d && d.failed) || 0;
        paint(failed
          ? '<p><b>Saved ' + ((d && d.done) || 0) + ' of ' + n + '.</b> ' + failed +
            ' did not arrive. Run it again on wifi to pick up the rest.</p>'
          : '<p><b>All done.</b> Playbox and every picture are on the tablet now. ' +
            'Turn the wifi off and try it \u2014 it should open just the same.</p>',
          '<button class="go" id="offDone">Close</button>');
      }, function(p){ bar(p.done, p.failed); });
    });
  }
}
function openDrawer(){
  var p = $('drawerPanel');
  p.innerHTML = '<h3>Playbox</h3>';
  MENU.forEach(function(m){
    if(m.group){
      var g = document.createElement('div');
      g.className = 'dgroup'; g.textContent = m.group;
      p.appendChild(g);
      return;
    }
    var b = document.createElement('button');
    b.className = 'ditem' + (m.id && m.id === S.screen ? ' cur' : '');
    b.setAttribute('role', 'menuitem');
    b.innerHTML = '<span class="de">' + m.emoji + '</span>' + m.name;
    b.addEventListener('click', function(){
      closeDrawer();
      if(m.id === 'trace'){ go('paint'); setTimeout(openTemplates, 200); return; }
      if(m.id){ go(m.id); return; }
      if(m.act === 'newpic'){ go('paint'); setTimeout(newPicture, 200); return; }
      if(m.act === 'backup'){ exportBackup(); return; }
      if(m.act === 'restore'){ $('bakIn').click(); return; }
      if(m.act === 'offline'){ openOffline(); return; }
      if(m.act === 'full'){ toggleFullscreen(); return; }
      if(m.act === 'help'){ showHelp(); return; }
    });
    p.appendChild(b);
  });
  $('drawer').classList.add('on');
}
function closeDrawer(){ $('drawer').classList.remove('on'); }

$('menuBtn').addEventListener('click', openDrawer);
$('drawer').addEventListener('click', function(e){ if(e.target === $('drawer')) closeDrawer(); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeDrawer(); });

$('backBtn').addEventListener('click', function(){ go('home'); });
var cards = document.querySelectorAll('[data-go]');
for(var ci = 0; ci < cards.length; ci++){
  (function(el){
    el.addEventListener('click', function(){
      var dest = el.getAttribute('data-go');
      if(dest === 'trace'){ go('paint'); setTimeout(openTemplates, 180); return; }
      go(dest);
    });
  })(cards[ci]);
}

function applyAge(){
  if(palette().indexOf(S.color) === -1) S.color = palette()[0];
  S.size = 10;
  buildRail('paintRail'); buildRail('animRail');
  buildColors('paintColors'); buildColors('animColors');
  buildSizes('paintSizes'); buildSizes('animSizes');
  buildShapeBar();
  if(S.screen === 'scene') buildScene();
  if(S.screen === 'music') buildMusic();
  if(S.screen === 'anim') buildStrip();
}

$('helpBtn').addEventListener('click', showHelp);

function showHelp(){
  showModal('<h2>How to use Playbox</h2>' +
    '<p style="text-align:left;line-height:1.6">' +
    '<b>\uD83C\uDFA8 Paint</b> \u2013 pick a brush on the left, a colour along the bottom.<br>' +
    '<b>\uD83D\uDDBC\uFE0F Trace</b> \u2013 outline pictures to colour in. Also on the ' +
    '<b>Traces</b> button while painting.<br>' +
    '<b>\uD83C\uDF33 Scene</b> \u2013 puts a background behind your art. Swap it any time; ' +
    'your drawing stays put.<br>' +
    '<b>\uD83C\uDFAC Animate</b> \u2013 draw frames and play them as a cartoon. Set how long ' +
    'each one holds.<br>' +
    '<b>\uD83C\uDFB5 Music</b> \u2013 tap pads, or build a beat in the grid.<br>' +
    '<b>\uD83D\uDDC2\uFE0F My Stuff</b> \u2013 everything you saved. Tap <b>Select</b> to ' +
    'tick several at once and delete or share them.' +
    '</p><div class="sheetrow"><button class="go" id="helpDone">Got it</button></div>');
  $('helpDone').onclick = closeModal;
}

$('fsBtn').addEventListener('click', function(){ toggleFullscreen(); });

function toggleFullscreen(){
  var d = document, el = d.documentElement;
  var isFs = d.fullscreenElement || d.webkitFullscreenElement;
  try{
    if(isFs){
      if(d.exitFullscreen) d.exitFullscreen();
      else if(d.webkitExitFullscreen) d.webkitExitFullscreen();
    } else if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else toast('Full screen is not available here');
  }catch(e){ toast('Full screen is not available here'); }
}

/* Silk and mobile Chromium will rubber-band or zoom the page mid-stroke;
   these keep a dragging finger drawing instead of scrolling. */
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('touchmove', function(e){ if(e.touches.length > 1) e.preventDefault(); }, { passive:false });
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ e.preventDefault(); });

var resizeTimer = null;
function onResize(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    if(S.screen === 'paint'){
      fitStack($('paintWrap'), $('paintStack'), $('paintCanvas'),
               [$('paintOverlay'), $('paintBg'), $('paintTrace')]);
      renderEnv($('paintBg'), S.paintEnv);
    }
    if(S.screen === 'anim'){
      fitStack($('animWrap'), $('animStack'), $('animCanvas'),
               [$('animOverlay'), $('animOnion'), $('animBg'), $('animTrace')]);
      renderEnv($('animBg'), S.animEnv);
      loadFrame(S.frameIdx);
    }
    if(S.screen === 'scene') fitSceneBg();
  }, 160);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', function(){ setTimeout(onResize, 300); });

applyAge();
requestPersistence();
go('home');

/* exposed only so the page can be smoke-tested from the console */
/* Attached on 'load', never in the markup. The whole app is one request by
   design - the Kids allowlist is the only way onto this tablet and a blocked
   asset would break it - so the worker and the manifest wait until the page
   is already up. Once the worker is running the count drops to zero. */
window.addEventListener('load', function(){
  try{
    var l = document.createElement('link');
    l.rel = 'manifest'; l.href = 'manifest.webmanifest';
    document.head.appendChild(l);
  }catch(e){}

  /* ?fresh=1 is the repair route for a tablet with no developer tools: the
     worker throws away every cache and hands back a clean copy. Re-registering
     here would undo that in the same breath, so this one load stays plain.
     The next ordinary launch turns offline back on by itself. */
  if(location.search.indexOf('fresh=1') !== -1) return;

  if(!('serviceWorker' in navigator)) return;
  try{
    navigator.serviceWorker.register('sw.js').then(function(){
      /* All 181 trace pictures come to 2MB, so there is no sense making a
         grown-up hunt through a menu to fetch them. Wait until the app is
         up and idle, then pull them quietly. Nothing here is awaited and
         nothing shows a spinner - if it fails the app is unaffected. */
      setTimeout(saveArtQuietly, 4000);
    })['catch'](function(){
      /* Older Silk, a private window, or a browser that simply says no.
         Playbox works exactly as before; it just needs wifi each time. */
    });
  }catch(e){}
});

var artSaveStarted = false;
var artDiag = [];
function saveArtQuietly(){
  artDiag.push('called');
  if(!navigator.serviceWorker){ artDiag.push('no sw'); return; }
  /* Respect an explicit data saver, and nothing else. effectiveType was in
     this check too and it silently killed the download every single time:
     Chromium derives it from observed round trips, so a few seconds into a
     fresh page it still reads '2g' regardless of the real connection. A
     guess about link quality is not worth breaking the feature over - the
     whole payload is 2MB, and a failed fetch costs nothing but a retry on
     the next launch. */
  var c = navigator.connection;
  if(c && c.saveData){ artDiag.push('data saver on'); return; }

  function send(){
    if(artSaveStarted){ artDiag.push('already started'); return; }
    if(!navigator.serviceWorker.controller){ artDiag.push('no controller'); return; }
    artDiag.push('sending');
    artSaveStarted = true;
    loadExtraTraces(function(list){
      if(!list || !list.length){ artDiag.push('manifest empty'); artSaveStarted = false; return; }
      var urls = list.map(function(e){ return 'traces/' + encodeURIComponent(e.file); });
      try{ navigator.serviceWorker.controller.postMessage({ cmd:'precache-art', urls:urls }); }
      catch(e){}
    });
  }

  if(navigator.serviceWorker.controller){ send(); return; }

  /* First ever visit: registering, installing, activating and claiming the
     page all take a moment, so there is no controller to talk to yet. Bailing
     out here is what made a brand new tablet report '0 of 181 saved' until it
     was opened a second time. Wait for the worker instead. */
  try{ navigator.serviceWorker.addEventListener('controllerchange', send); }catch(e){}
  try{ navigator.serviceWorker.ready.then(function(){ setTimeout(send, 600); }); }catch(e){}
}

                     PRESETS:PRESETS, SHAPE_CATS:SHAPE_CATS, drawShape:drawShape, GAL_KINDS:GAL_KINDS, ENVIRONMENTS:ENVIRONMENTS,
                     ENV_CATS:ENV_CATS, renderPaper:renderPaper, renderEnv:renderEnv, flatten:flatten,
                     placeImport:placeImport, toOutline:toOutline, openTemplates:openTemplates,
                     openCropper:openCropper, saveMyTrace:saveMyTrace, exportBackup:exportBackup,
                     loadExtraTraces:loadExtraTraces, keyOutWhite:keyOutWhite,
                     getExtra:function(){ return EXTRA; },
                     wipSave:wipSave, canvasPNG:canvasPNG, go:go,
                     store:store, blankScene:blankScene, extraGroups:extraGroups, artHasInk:artHasInk,
                     getSel:function(){ return SEL; }, getDC:function(){ return DC; },
                     pickEraser:pickEraser, pickAt:pickAt, doUndo:doUndo, DPRof:function(){ return DPR; },
                     openOffline:openOffline, offlineSupported:offlineSupported, swAsk:swAsk,
                     saveArtQuietly:saveArtQuietly, artDiag:function(){ return artDiag; } };

})();
